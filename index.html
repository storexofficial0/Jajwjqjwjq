<script>
/* ================= StoreX ERROR DIAGNOSTICS ================= */
(function(){
  window.__sxErrors=[];
  var show=/^(content|file):/.test(location.protocol)||/debug/i.test(location.search+location.hash);
  function paintBanner(){
    if(!show) return;
    var b=document.getElementById('sx-err-banner');
    if(!b){ b=document.createElement('div'); b.id='sx-err-banner';
      b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483647;max-height:45vh;overflow:auto;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:10px 12px;white-space:pre-wrap;word-break:break-word';
      (document.body||document.documentElement).appendChild(b); }
    b.innerHTML='<button onclick="this.parentNode.remove()" style="float:right;margin-left:8px;padding:2px 8px">X</button><b>ERROR DETAILS (send this to developer):</b>\n'+
      window.__sxErrors.slice(-4).map(function(e){return '• '+e.replace(/</g,'&lt;');}).join('\n');
  }
  window.sxReportError=function(where,err){
    var msg=where+': '+((err&&err.message)||err)+(err&&err.stack?'\n   '+String(err.stack).split('\n').slice(0,3).join('\n   '):'');
    window.__sxErrors.push(msg); try{console.error('[StoreX]',msg);}catch(_){}
    paintBanner();
  };
  window.addEventListener('error',function(e){ window.sxReportError('runtime',e.error||e.message); });
  window.addEventListener('unhandledrejection',function(e){ window.sxReportError('promise',e.reason); });
})();
</script>
<script>
/* ================= StoreX CUSTOMER CACHE =================
   Fast repeat visits:
   1) Last complete cloud state is stored in localStorage.
   2) The cached storefront renders immediately on repeat visits.
   3) Supabase is then read in the background and the screen is refreshed.
   4) Realtime changes replace the current screen without requiring a manual reload.
*/
(function(){
  'use strict';
  const KEY = 'StoreX.customer.snapshot.v5';
  const MAX_AGE = 1000 * 60 * 60 * 24 * 30; // keep a snapshot for up to 30 days

  window.StoreXCustomerCache = {
    read(){
      try{
        const raw = localStorage.getItem(KEY);
        if(!raw) return null;
        const item = JSON.parse(raw);
        if(!item || !item.data) return null;
        return item;
      }catch(e){ return null; }
    },
    write(data){
      try{
        localStorage.setItem(KEY, JSON.stringify({
          version:4,
          savedAt:Date.now(),
          data:data
        }));
      }catch(e){
        // Storage can be unavailable/full; the website must still work normally.
      }
    },
    isUsable(item){
      return !!(item && item.data && (Date.now() - (item.savedAt||0)) <= MAX_AGE);
    }
  };
})();
</script>


<script>
/* ================= StoreX PERFORMANCE ENGINE ================= */
window.StoreXPerf=window.StoreXPerf||{};
StoreXPerf.compressImageForWeb=async function(file,opts){
  if(!file||!file.type||!file.type.startsWith('image/')) return file;
  if(file.type==='image/svg+xml'||file.type==='image/gif') return file;
  /* Storage-saving defaults: max 1600px on the long side, WebP, aims for <= ~180 KB
     (quality steps down, then the size, until the target is met). */
  const o=Object.assign({maxDim:1600,quality:.8,minQuality:.56,targetKB:180,minDim:640},opts||{});
  try{
    let bitmap;
    try{ bitmap=await createImageBitmap(file,{imageOrientation:'from-image'}); }catch(_){ bitmap=await createImageBitmap(file); }
    let scale=Math.min(1,o.maxDim/Math.max(bitmap.width,bitmap.height));
    let q=o.quality, best=null;
    const encode=async(sc,qual)=>{
      const w=Math.max(1,Math.round(bitmap.width*sc)),h=Math.max(1,Math.round(bitmap.height*sc));
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d',{alpha:true}); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
      ctx.drawImage(bitmap,0,0,w,h);
      let blob=await new Promise(r=>canvas.toBlob(r,'image/webp',qual));
      if(!blob||blob.type!=='image/webp'){ // very old browsers: JPEG with white background
        const c2=document.createElement('canvas'); c2.width=w; c2.height=h; const x2=c2.getContext('2d');
        x2.fillStyle='#fff'; x2.fillRect(0,0,w,h); x2.drawImage(bitmap,0,0,w,h);
        blob=await new Promise(r=>c2.toBlob(r,'image/jpeg',qual));
      }
      return blob;
    };
    for(let i=0;i<8;i++){
      const blob=await encode(scale,q);
      if(blob&&(!best||blob.size<best.size)) best=blob;
      if(!blob||blob.size<=o.targetKB*1024) break;
      if(q>o.minQuality+.001) q=Math.max(o.minQuality,q-.08);
      else{ scale*=.85; if(Math.max(bitmap.width,bitmap.height)*scale<o.minDim) break; }
    }
    bitmap.close&&bitmap.close();
    if(!best||best.size>=file.size) return file; // original already smaller: keep it
    const ext=best.type==='image/webp'?'.webp':'.jpg';
    return new File([best],(file.name||'image').replace(/\.[^.]+$/i,'')+ext,{type:best.type,lastModified:Date.now()});
  }catch(e){console.warn('Image optimization skipped:',e);return file;}
};
StoreXPerf.fastPublicState=async function(){
  if(!supabaseClient||!SUPABASE_READY) return null;
  try{ const {data,error}=await supabaseClient.rpc('storex_public_state'); if(error) throw error; return data&&typeof data==='object'?data:null; }
  catch(e){console.warn('Fast public state RPC unavailable; using existing reads:',e);return null;}
};
</script>

.footer-share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.footer-share .share-btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);}
.footer-share .share-btn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:#fff;}
.invoice-admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px;}
.invoice-detail-export{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa}.invoice-detail-preview{background:#eee;border:1px solid #ddd;border-radius:10px;padding:12px;overflow:auto;max-height:620px}.invoice-detail-paper{background:var(--card);margin:0 auto;padding:18px;max-width:760px;box-shadow:0 4px 18px rgba(0,0,0,.08)}.invoice-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.invoice-preview{background:#f7f7f7;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;}
.invoice-mini-paper{background:var(--card);border:1px solid #ddd;max-width:520px;margin:auto;padding:18px;font-size:12px;}
.invoice-mini-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:10px;}
.invoice-mini-logo{max-width:110px;max-height:48px;object-fit:contain;}
.invoice-print-note{font-size:12px;color:var(--ink-soft);margin:8px 0 0;}
@media(max-width:650px){.invoice-admin-grid{grid-template-columns:1fr;}}
.main-nav{display:flex;gap:22px;align-items:center;white-space:nowrap;}
.main-nav a{font-size:14px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;}
.main-nav a:hover{border-color:var(--primary);}
.mobile-toggle{display:inline-flex;background:none;border:none;padding:8px;color:var(--header-text);align-items:center;justify-content:center;order:4;min-width:44px;min-height:44px;position:relative;z-index:50;touch-action:manipulation;-webkit-tap-highlight-color:transparent;visibility:visible!important;cursor:pointer}.mobile-search-toggle{display:none;background:none;border:none;padding:8px;color:var(--header-text);}
.mobile-toggle svg,.mobile-search-toggle svg{width:24px;height:24px;}
.mobile-drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;}
.mobile-drawer.open{display:block;}
.mobile-drawer-panel{background:var(--card);width:82%;max-width:320px;height:100%;padding:22px 18px;overflow-y:auto;}
.mobile-drawer-panel a{display:block;padding:12px 4px;font-weight:600;border-bottom:1px solid var(--line);}
.mobile-drawer-close{float:right;background:none;border:none;font-size:22px;color:var(--ink-soft);}
@media (max-width:820px){
  .search-wrap{display:contents;}
  .main-nav{display:none;}
  .mobile-toggle{display:inline-flex;order:1;justify-self:start;grid-column:1;grid-row:1;}
  .header-row{grid-template-columns:auto auto 1fr auto;padding:10px 0;}
  .logo-wrap{order:2;padding-left:4px;grid-column:2;grid-row:1;}
  .header-icons{order:3;grid-column:3;grid-row:1;justify-self:end;}
  .search-form{display:none;order:4;grid-column:1/-1;grid-row:2;margin-top:8px;max-width:none;}
  .search-form.mobile-open{display:flex;}
  .mobile-search-toggle{display:inline-flex;order:4;grid-column:4;grid-row:1;justify-self:end;}
}

/* ---------- Hero ---------- */
.hero{position:relative;background:linear-gradient(135deg,#1F2328,#3A3F47);color:#fff;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero-bg-slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;}
.hero-bg-slide.active{opacity:1;}
.hero-bg-desktop,.hero-bg-mobile{position:absolute;inset:0;background-size:cover;background-position:center;}
.hero-bg-mobile{display:none;}
@media (max-width:720px){.hero-bg-desktop{display:none;} .hero-bg-mobile{display:block;}}
.hero-overlay{position:absolute;inset:0;background:rgba(10,10,12,var(--hero-overlay,0));}
.hero-inner{position:relative;padding:64px 20px;max-width:1240px;margin:0 auto;min-height:220px;display:flex;flex-direction:column;justify-content:center;}
.hero-inner.align-center{align-items:center;text-align:center;}
.hero-inner.align-left{align-items:flex-start;text-align:left;}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 12px;max-width:640px;font-weight:700;}
.hero p{font-size:17px;color:rgba(255,255,255,.85);max-width:520px;margin:0 0 22px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--btn-bg,var(--primary));color:var(--btn-text,#fff);border:none;padding:12px 22px;border-radius:6px;font-weight:600;font-size:14.5px;transition:background .15s;}
.btn:hover{background:var(--primary-dark);filter:brightness(1.05);}
.btn.secondary{background:transparent;border:1.5px solid currentColor;}
.btn.small{padding:8px 14px;font-size:13px;}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line);}
.btn.danger{background:#B3261E;color:#fff;}
.btn.danger:hover{background:#8f1e18;}

/* ---------- Sections ---------- */
.section{padding:44px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:14px;flex-wrap:wrap;}
.section-head h2{font-size:24px;margin:0 0 4px;font-weight:700;}
.section-head p{margin:0;color:var(--ink-soft);font-size:14.5px;}
.section-head a{font-size:13.5px;font-weight:600;color:var(--primary);}

/* ---------- Product Grid / Card ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
/* Spotlight Desktop Height */
@media (min-width:721px){
  .spotlight-card .spotlight-img{
    height:270px !important;
    aspect-ratio:auto !important;
  }
}

/* Spotlight Mobile Height */
@media (max-width:720px){
  .spotlight-card .spotlight-img{
    height:200px !important;
    aspect-ratio:auto !important;
  }
}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;} .grid.cols-2{grid-template-columns:repeat(2,1fr);} .grid.cols-4{grid-template-columns:repeat(3,1fr);}}
@media (max-width:480px){.grid.compact-fallback{grid-template-columns:repeat(2,1fr);gap:10px;} .grid.cols-4{grid-template-columns:repeat(2,1fr);}}
.spotlight-card{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.spotlight-card .spotlight-img{aspect-ratio:1/1;background:#1A1A1A;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.spotlight-card .spotlight-img img{width:100%;height:100%;object-fit:contain;}
.spotlight-card .spotlight-body{padding:26px 30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.spotlight-card .spotlight-body h3{font-size:24px;margin:0;font-weight:700;}
.spotlight-card .spotlight-body .price{font-size:22px;}
@media (max-width:720px){.spotlight-card{grid-template-columns:1fr;} .spotlight-card .spotlight-body{padding:16px;}}
.cat-showcase-group{margin-bottom:34px;}
.cat-showcase-group:last-child{margin-bottom:0;}
.cat-showcase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cat-showcase-head h3{font-size:18px;margin:0;font-weight:700;}
.cat-showcase-head a{font-size:13px;font-weight:600;color:var(--primary);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s;position:relative;}
.card:hover{border-color:#D8D3C9;box-shadow:0 6px 18px rgba(20,20,20,.07);}
.card-img{aspect-ratio:1/1;background:#1A1A1A;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:contain;}
.card-badge{position:absolute;top:8px;left:8px;background:#D4AF37;color:#0A0A0A;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;z-index:2;}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1;}
.card-title{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;}
.card-desc{font-size:12px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.price-row{display:flex;align-items:baseline;gap:7px;margin-top:2px;}
.price{font-size:16px;font-weight:700;color:var(--ink);}
.price-old{font-size:12px;color:var(--ink-soft);text-decoration:line-through;}
.discount-pill{font-size:11px;font-weight:700;color:#0A0A0A;background:#D4AF37;padding:2px 6px;border-radius:4px;}
.card-cta{margin-top:auto;width:100%;background:var(--btn-bg,var(--primary));color:var(--btn-text,#fff);border:none;padding:9px;font-size:12.5px;font-weight:700;border-radius:6px;}
.card-cta:hover{background:var(--primary-dark);}
@media (max-width:480px){
  .card-title{font-size:11.5px;min-height:2.2em;}
  .price{font-size:13px;}
  .card-cta{font-size:11px;padding:7px;}
  .card-body{padding:7px 8px 8px;gap:3px;}
}

/* ---------- Categories (box grid) ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:8px;transition:box-shadow .15s,border-color .15s;}
.cat-card:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(20,20,20,.07);}

/* Dynamic full width image container */
.cat-icon{width:100%;max-width:100%;height:130px;background:#1A1A1A;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;border-radius:6px;margin:0 auto;}
.cat-icon img{width:100%;height:100%;object-fit:cover;display:block;}

.cat-name{font-size:13px;font-weight:600;text-align:center;padding:8px 2px 2px 2px;}

/* Mobile responsiveness */
@media (max-width:480px){
  .cat-grid{grid-template-columns:repeat(3,1fr);gap:8px;} 
  .cat-icon{max-width:100%;height:90px;} 
  .cat-name{font-size:11px;padding:5px 2px 0 2px;}
}

/* ---------- Flash sale ---------- */
.flash{background:var(--ink);color:#fff;border-radius:12px;overflow:hidden;position:relative;display:grid;grid-template-columns:1.1fr 1fr;min-height:200px;}
.flash-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;}
.flash-info{background:var(--card);color:var(--ink);position:relative;padding:30px;display:flex;flex-direction:column;justify-content:center;gap:10px;}
.flash-eyebrow{color:var(--primary);font-weight:700;font-size:13px;}
.flash-info h3{font-size:26px;margin:0;font-weight:700;}
.flash-info p{margin:0;color:inherit;opacity:.8;font-size:14px;}
.countdown{display:flex;gap:8px;margin-top:6px;}
.countdown .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px 10px;min-width:52px;text-align:center;}
.countdown .chip b{display:block;font-size:19px;font-family:'Space Grotesk';}
.countdown .chip span{font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;}
.flash-visual{position:relative;background-color:#FFFFFF;background-position:center;background-repeat:no-repeat;overflow:hidden;}
.flash-visual img{width:100%;height:100%;display:block;object-position:center;}
.flash-visual.fit-cover img{object-fit:cover;}
.flash-visual.fit-contain img{object-fit:contain;}
.flash-visual.fit-stretch img{object-fit:fill;}
.flash-visual-slide{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-color:#FFFFFF;opacity:0;transition:opacity .8s ease;}
.flash-visual-slide img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;}
.flash-visual-slide.active{opacity:1;}
@media (max-width:720px){.flash{grid-template-columns:1fr;} .flash-visual{min-height:140px;order:-1;}}
.flash-carousel{position:relative;overflow:hidden;border-radius:12px;}
.flash-track{display:flex;transition:transform .6s ease;}
.flash-slide{flex:0 0 100%;min-width:0;display:block;}
.flash-slide .flash{border-radius:12px;}
.flash-dots{display:flex;gap:6px;justify-content:center;margin-top:10px;}
.flash-dots button{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;padding:0;}
.flash-dots button.active{background:var(--primary);width:20px;border-radius:5px;}

/* ---------- Banner ---------- */
.promo-banner{border-radius:12px;overflow:hidden;background:#1A1A1A;position:relative;min-height:160px;display:flex;align-items:center;background-size:cover;background-position:center;}
.promo-banner-inner{position:relative;padding:30px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.promo-banner-inner h3{margin:0 0 6px;font-size:22px;}
.promo-banner-inner p{margin:0 0 14px;font-size:14px;}
.promo-banner-overlay{position:absolute;inset:0;background:rgba(0,0,0,.25);}

/* ---------- Footer ---------- */
#site-footer{background:var(--footer-bg,#0A0A0A);color:var(--footer-text,#FFFFFF);margin-top:60px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px;padding:44px 0 24px;}
.footer-grid h4{color:#FFFFFF;font-size:14px;margin:0 0 12px;}
.footer-grid a{display:block;font-size:13.5px;padding:4px 0;color:#FFFFFF;}
.footer-grid a:hover{color:#FFFFFF;text-decoration:underline;}
.footer-bottom{border-top:1px solid rgba(255,255,255,.28);padding:16px 0;font-size:12.5px;color:#FFFFFF;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.social-row{display:flex;gap:10px;margin-top:10px;}
.social-row a{width:32px;height:32px;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FFFFFF;overflow:hidden;}
.social-row a img{width:32px;height:32px;object-fit:contain;display:block;background:transparent;}
@media (max-width:720px){.footer-grid{grid-template-columns:1fr 1fr;}}

/* ---------- Empty / error states ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.empty-state .icon{font-size:40px;margin-bottom:10px;}
.empty-state h3{color:var(--ink);margin:0 0 6px;}

/* ---------- Breadcrumb ---------- */
.crumb{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.crumb a:hover{color:var(--primary);}

/* ---------- Product detail ---------- */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
@media (max-width:820px){.pd-grid{grid-template-columns:1fr;gap:20px;}}
.pd-main-img{background:#1A1A1A;border-radius:10px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pd-main-img img{width:100%;height:100%;object-fit:contain;}

/* ===== Home product rows: horizontal scroll ===== */
.h-scroll-wrap{position:relative;}
.h-scroll{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:2px 2px 10px;scrollbar-width:thin;}
.h-scroll::-webkit-scrollbar{height:6px;}
.h-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
.h-scroll > .card{flex:0 0 190px;width:190px;scroll-snap-align:start;}
.h-scroll > .card .card-img{height:auto!important;max-height:none!important;min-height:0!important;aspect-ratio:1/1!important;}
.h-scroll > .card .card-img img{width:100%!important;height:100%!important;object-fit:cover!important;}
.h-scroll > .card .card-title{font-size:13px!important;min-height:2.5em!important;}
.h-scroll > .card .price{font-size:15px!important;}
@media (max-width:720px){.h-scroll{gap:8px;}.h-scroll > .card{flex-basis:42vw;width:42vw;max-width:190px;}}
.hs-btn{display:none;position:absolute;top:38%;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:20px;line-height:1;cursor:pointer;color:var(--ink);align-items:center;justify-content:center;padding:0;}
.hs-btn.prev{left:-10px;}.hs-btn.next{right:-10px;}
@media (min-width:821px) and (hover:hover){.h-scroll-wrap:hover .hs-btn{display:flex;}}
.cat-showcase-group .h-scroll-wrap{margin-top:0;}

/* ===== Product page: swipeable image slider + clamped description ===== */
.pd-grid > div{min-width:0;}
.pd-slider-wrap{position:relative;}
.pd-slider{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:#1A1A1A;border-radius:10px;scrollbar-width:none;}
.pd-slider::-webkit-scrollbar{display:none;}
.pd-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.pd-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.pd-slide-count{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;pointer-events:none;}
.pd-arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);font-size:22px;line-height:1;cursor:pointer;align-items:center;justify-content:center;padding:0;color:var(--ink);}
.pd-arrow.prev{left:8px;}.pd-arrow.next{right:8px;}
@media (min-width:821px) and (hover:hover){.pd-slider-wrap:hover .pd-arrow{display:flex;}}
.pd-desc.clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.pd-more-btn{display:none;background:none;border:0;padding:0;margin:-6px 0 12px;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;}
.pd-more-btn.show{display:inline-block;}
.pd-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.pd-thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;}
.pd-thumbs img.active{border-color:var(--primary);}
.pd-title{font-size:26px;margin:0 0 8px;font-weight:700;}
.pd-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.tag-pill{font-size:11.5px;background:#1A1A1A;padding:3px 9px;border-radius:20px;color:var(--ink-soft);}
.pd-desc{color:var(--ink-soft);font-size:14.5px;margin:14px 0;white-space:pre-line;}

/* ---------- Admin ---------- */
.admin-shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;background:#F3F2EF;}
.admin-sidebar{background:#1F2328;color:#D4D6D9;padding:20px 14px;}
.admin-sidebar .brand{color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:19px;margin-bottom:20px;padding:0 6px;}
.admin-sidebar .brand .x{color:var(--primary);}
.admin-sidebar a,.admin-sidebar button.navlink{display:block;width:100%;text-align:left;background:none;border:none;color:#B7BABE;padding:9px 10px;border-radius:6px;font-size:13.5px;font-weight:600;margin-bottom:2px;}
.admin-sidebar a:hover,.admin-sidebar button.navlink:hover{background:#2C3036;color:#fff;}
.admin-sidebar a.active,.admin-sidebar button.navlink.active{background:var(--primary);color:#fff;}
.admin-sidebar .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#71757B;margin:16px 6px 6px;}
.admin-main{padding:26px 30px;overflow-x:auto;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.admin-topbar h1{font-size:22px;margin:0;}
.admin-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;}
.stat-box b{font-size:26px;display:block;font-family:'Space Grotesk';}
.stat-box span{font-size:12.5px;color:var(--ink-soft);}
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.admin-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.admin-table img{width:40px;height:40px;object-fit:cover;border-radius:4px;}
.row-actions{display:flex;gap:6px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:2px;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=password],.field input[type=datetime-local],.field select,.field textarea{
  border:1.5px solid var(--line);border-radius:6px;padding:9px 10px;font-size:13.5px;font-family:inherit;background:var(--card);color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}

<script id="StoreXRouterShim">
/* Clean page URLs: /p/product-name/, /category/watches/ ... (admin stays on #/admin-of-storex). */
(function(){
  var PM=false; window.SX_PATHMODE=PM; /* hash mode: links stay store.tfoda.com/#/p/... so reload never 404s */
  function norm(p){p=String(p||'/').replace(/\/index\.html$/,'/').replace(/\/{2,}/g,'/');return p.length>1?p.replace(/\/+$/,''):'/';}
  function isAdmin(h){return String(h||'').indexOf('#/admin-of-storex')===0;}
  window.sxToUrl=function(r){
    r=String(r||'/');if(r.charAt(0)!=='/')r='/'+r;
    var q='',i=r.indexOf('?');if(i>-1){q=r.slice(i);r=r.slice(0,i);}
    r=norm(r);if(r!=='/'&&!/\.[a-z0-9]+$/i.test(r))r+='/';
    return r+q;
  };
  window.sxRoute=function(){
    var h=location.hash;
    if(h&&h.indexOf('#/')===0)return h.slice(1);
    if(!PM)return '/';
    return norm(location.pathname)+location.search;
  };
  if(!PM)return;
  var h0=location.hash;
  if(h0.indexOf('#/')===0&&!isAdmin(h0)){try{history.replaceState(null,'',sxToUrl(h0.slice(1)));}catch(e){}}   /* old #/ links keep working */
  window.addEventListener('hashchange',function(){
    var h=location.hash;
    if(h.indexOf('#/')===0&&!isAdmin(h)){try{history.replaceState(null,'',sxToUrl(h.slice(1)));}catch(e){}}
  });
  window.sxGo=function(r){
    var u=sxToUrl(r);
    if(u!==location.pathname+location.search||location.hash)history.pushState(null,'',u);
    window.dispatchEvent(new Event('sxnav'));
    if(typeof render==='function')render();
  };
  window.addEventListener('popstate',function(){if(window.__sxReady&&typeof render==='function')render();});
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
    var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;
    var t=a.getAttribute('target');if(t&&t!=='_self')return;if(a.hasAttribute('download'))return;
    var href=a.getAttribute('href')||'',r=null;
    if(href.indexOf('#/')===0){if(isAdmin(href))return;r=href.slice(1);}
    else if(href.charAt(0)==='/'&&href.charAt(1)!=='/'){r=href;}
    else return;
    e.preventDefault();sxGo(r);
  });
  /* give every internal link a real, crawlable address */
  var tm=null;
  function rewrite(){
    var l=document.querySelectorAll('a[href^="#/"]');
    for(var i=0;i<l.length;i++){var h=l[i].getAttribute('href');if(!isAdmin(h))l[i].setAttribute('href',sxToUrl(h.slice(1)));}
  }
  function start(){new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(rewrite,0);}).observe(document.documentElement,{childList:true,subtree:true});rewrite();}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

   The values below are safe demo fallbacks when Supabase has no saved data yet.

/* ---------- Website analytics: page views / visitor sessions ---------- */
let SITE_ANALYTICS_SESSION='';
let SITE_ANALYTICS_LAST_TOKEN='';
function getSiteAnalyticsSession(){
  try{ let v=sessionStorage.getItem('StoreX.siteAnalyticsSession.v1'); if(!v){v=uid();sessionStorage.setItem('StoreX.siteAnalyticsSession.v1',v);} return v; }catch(_){ return uid(); }
}
async function storexBaseTrackSitePageView(){
  const path=route(); if(path.startsWith('/admin-of-storex')) return;
  const session=getSiteAnalyticsSession();
  const token=session+'|'+path;
  if(!supabaseClient||!SUPABASE_READY)return false; // not connected yet: caller retries (do NOT consume the token)
  if(SITE_ANALYTICS_LAST_TOKEN===token)return true;
  SITE_ANALYTICS_LAST_TOKEN=token;
  try{
    const modern=await supabaseClient.from('storex_site_analytics').insert({event_type:'page_view',visitor_key:session,page_path:path,session_key:session,event_date:new Date().toISOString().slice(0,10),metadata:{},created_at:new Date().toISOString()});
    if(modern.error){
      const legacy=await supabaseClient.from('storex_site_analytics').insert({session_id:session,path,viewed_at:new Date().toISOString()});
      if(legacy.error)throw legacy.error;
    }
  }catch(e){ window.STOREX_ANALYTICS_ERROR=(e&&e.message)||String(e); console.warn('Site analytics event skipped:',e); }
  return true;
}
async function fetchSiteAnalytics(start,end){
  if(!supabaseClient||!SUPABASE_READY)return [];
  const rows=[]; let from=0,step=1000;
  while(true){
    let data,error;
    const modern=await supabaseClient.from('storex_site_analytics').select('visitor_key,page_path,session_key,event_date,created_at').eq('event_type','page_view').gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at',{ascending:true}).range(from,from+step-1);
    data=modern.data; error=modern.error;
    if(error){
      const legacy=await supabaseClient.from('storex_site_analytics').select('session_id,path,viewed_at').gte('viewed_at',start.toISOString()).lt('viewed_at',end.toISOString()).order('viewed_at',{ascending:true}).range(from,from+step-1);
      if(legacy.error)throw legacy.error;
      data=(legacy.data||[]).map(r=>({visitor_key:r.session_id,page_path:r.path,session_key:r.session_id,event_date:String(r.viewed_at||'').slice(0,10),created_at:r.viewed_at}));
    }else data=(data||[]).map(r=>({visitor_key:r.visitor_key,page_path:r.page_path,session_key:r.session_key,event_date:r.event_date,created_at:r.created_at}));
    const batch=data||[]; rows.push(...batch); if(batch.length<step)break; from+=step; if(from>100000)break;
  }
  return rows;
}
function analyticsRange(period,startDate,endDate){
  const now=new Date(); now.setHours(23,59,59,999);
  if(period==='yesterday'){const e=new Date(now);e.setDate(e.getDate()-1);const s=new Date(e);s.setHours(0,0,0,0);return [s,new Date(now.getFullYear(),now.getMonth(),now.getDate(),0,0,0,0)];}
  if(period==='7d'){const s=new Date(now);s.setDate(s.getDate()-6);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];}
  if(period==='30d'){const s=new Date(now);s.setDate(s.getDate()-29);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];}
  if(period==='specific'&&startDate){const s=new Date(startDate+'T00:00:00');const e=new Date((endDate||startDate)+'T00:00:00');e.setDate(e.getDate()+1);return [s,e];}
  if(period==='all'){return [new Date('2020-01-01T00:00:00'),new Date(now.getTime()+1)];}
  const s=new Date(now);s.setHours(0,0,0,0);return [s,new Date(now.getTime()+1)];
}
async function loadAnalyticsDashboard(){
  const period=document.getElementById('analytics-period')?.value||'today';
  const start=document.getElementById('analytics-start')?.value||'';
  const end=document.getElementById('analytics-end')?.value||'';
  const [a,b]=analyticsRange(period,start,end);
  try{
    const rows=await fetchSiteAnalytics(a,b);
    const visitors=new Set(rows.map(r=>String(r.visitor_key||r.session_key||'')).filter(Boolean)).size;
    const views=rows.length;
    const byDay={}; rows.forEach(r=>{const d=new Date(r.created_at).toLocaleDateString('en-CA');byDay[d]=(byDay[d]||0)+1;});
    const orders=ORDERS.filter(o=>{const t=new Date(o.created_at||0);return t>=a&&t<b;});
    const shipped=orders.filter(o=>['shipped','delivered'].includes(String(o.status||'').toLowerCase()) && String(o.status||'').toLowerCase()!=='returned');
    const returned=orders.filter(o=>String(o.status||'').toLowerCase()==='returned');
    const root=document.getElementById('analytics-results'); if(!root)return;
    root.innerHTML=`<div class="admin-card" style="margin-top:12px;"><div class="admin-stats-grid"><div class="admin-stat"><b>${views.toLocaleString()}</b><span>Page views</span></div><div class="admin-stat"><b>${visitors.toLocaleString()}</b><span>Visitors</span></div><div class="admin-stat"><b>${orders.length.toLocaleString()}</b><span>Orders</span></div><div class="admin-stat"><b>${shipped.length.toLocaleString()}</b><span>Shipped / delivered</span></div><div class="admin-stat"><b>${returned.length.toLocaleString()}</b><span>Returned</span></div></div><h3 style="margin:18px 0 8px;">Daily breakdown</h3><div style="overflow:auto;"><table class="admin-table"><thead><tr><th>Date</th><th>Views</th></tr></thead><tbody>${Object.keys(byDay).sort().reverse().map(d=>`<tr><td>${esc(d)}</td><td>${byDay[d]}</td></tr>`).join('')||'<tr><td colspan="2">No website views recorded for this period.</td></tr>'}</tbody></table></div></div>`;
  }catch(e){const root=document.getElementById('analytics-results');if(root)root.innerHTML=`<div class="admin-card"><b>Analytics data is not available yet.</b><p style="color:var(--ink-soft);">Run the supplied Supabase analytics migration (phase-3.sql), then refresh this section.</p><p style="color:var(--ink-soft);font-size:12px;">Details: ${esc((e&&e.message)||String(e))}</p></div>`;}
}
function adminAnalytics(){
  setTimeout(loadAnalyticsDashboard,0);
  setTimeout(()=>{if(route().startsWith('/admin-of-storex')&&ADMIN_VIEW==='analytics')loadAnalyticsDashboard();},15000);
  return `<div class="admin-topbar"><h1>Website Analytics</h1><button class="btn small ghost" onclick="loadAnalyticsDashboard()">Refresh</button></div><div class="admin-card"><div class="form-grid" style="align-items:end;"><div class="field"><label>Period</label><select id="analytics-period" onchange="loadAnalyticsDashboard()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option><option value="all">All time</option><option value="specific">Specific period</option></select></div><div class="field"><label>Start date</label><input id="analytics-start" type="date" onchange="if(document.getElementById('analytics-period').value==='specific')loadAnalyticsDashboard();"></div><div class="field"><label>End date</label><input id="analytics-end" type="date" onchange="if(document.getElementById('analytics-period').value==='specific')loadAnalyticsDashboard();"></div></div><p style="font-size:12px;color:var(--ink-soft);margin:10px 0 0;">Website views are counted as page-view events; visitors are unique browser sessions recorded by the storefront. This dashboard refreshes automatically every 15 seconds.</p></div><div id="analytics-results"><div class="admin-card"><div class="empty-state">Loading analytics…</div></div></div>`;
}

/* ---------- Product analytics: one event per real product view / Buy Now click ---------- */
let PRODUCT_ANALYTICS = Object.create(null);
let PRODUCT_ANALYTICS_READY = false;
let PRODUCT_ANALYTICS_CHANNEL = null;
let LAST_TRACKED_PRODUCT_VIEW = '';

function analyticsCounts(p){
  const a=PRODUCT_ANALYTICS[String(p?.id||'')]||{};
  return {views:Math.max(0,Number(a.views??p?.views)||0),clicks:Math.max(0,Number(a.clicks??p?.clicks)||0)};
}
async function loadProductAnalytics(){
  if(!supabaseClient||!SUPABASE_READY)return;
  try{
    const {data,error}=await supabaseClient.from('storex_product_analytics').select('product_id,views,clicks,updated_at');
    if(error)throw error;
    PRODUCT_ANALYTICS=Object.create(null);
    (data||[]).forEach(r=>{PRODUCT_ANALYTICS[String(r.product_id)]={views:Number(r.views)||0,clicks:Number(r.clicks)||0,updated_at:r.updated_at};});
    PRODUCT_ANALYTICS_READY=true;
    if(route().startsWith('/admin-of-storex')) render();
  }catch(e){ console.warn('Product analytics read skipped:',e); }
}
async function trackProductEvent(productId,eventType){
  const id=String(productId||'').trim();
  const type=eventType==='click'?'click':'view';
  if(!id||!supabaseClient||!SUPABASE_READY)return;
  try{
    let data=null;
    const rpc=await supabaseClient.rpc('storex_track_product_event',{p_product_id:id,p_event_type:type});
    if(!rpc.error){
      data=Array.isArray(rpc.data)?rpc.data[0]:rpc.data;
    }else{
      // Fallback for databases where the RPC migration has not been installed.
      const {data:row,error:readError}=await supabaseClient.from('storex_product_analytics')
        .select('product_id,views,clicks,updated_at').eq('product_id',id).maybeSingle();
      if(readError)throw readError;
      const next={
        product_id:id,
        views:Math.max(0,Number(row?.views)||0)+(type==='view'?1:0),
        clicks:Math.max(0,Number(row?.clicks)||0)+(type==='click'?1:0),
        updated_at:new Date().toISOString()
      };
      const {error:writeError}=await supabaseClient.from('storex_product_analytics').upsert(next,{onConflict:'product_id'});
      if(writeError)throw writeError;
      data=next;
    }
    if(data&&data.product_id){
      PRODUCT_ANALYTICS[String(data.product_id)]={views:Number(data.views)||0,clicks:Number(data.clicks)||0,updated_at:data.updated_at};
      const p=PRODUCTS.find(x=>String(x.id)===id);
      if(p){p.views=Number(data.views)||0;p.clicks=Number(data.clicks)||0;}
      if(route().startsWith('/admin-of-storex')) render();
    }
  }catch(e){ window.SX_PA_ERR=(e&&e.message)||String(e); console.warn('Product analytics event skipped:',e); }
}
function trackProductViewOnce(productId){
  const id=String(productId||'').trim();
  const currentRoute=String(route());
  const token=id+'|'+currentRoute;
  if(!id||LAST_TRACKED_PRODUCT_VIEW===token)return;
  LAST_TRACKED_PRODUCT_VIEW=token;
  rememberRecentlyViewed(id);
  trackProductEvent(id,'view');
}
function getRecentlyViewedIds(){
  try{const v=JSON.parse(localStorage.getItem(RECENTLY_VIEWED_KEY)||'[]');return Array.isArray(v)?v.map(String).filter(Boolean):[];}catch(_){return [];}
}
function rememberRecentlyViewed(productId){
  const id=String(productId||'').trim(); if(!id)return;
  try{
    const ids=getRecentlyViewedIds().filter(x=>x!==id);
    ids.unshift(id);
    localStorage.setItem(RECENTLY_VIEWED_KEY,JSON.stringify(ids.slice(0,20)));
  }catch(_){ }
}
function recentlyViewedProducts(count=6){
  const ids=getRecentlyViewedIds();
  const out=[];
  ids.forEach(id=>{const p=PRODUCTS.find(x=>String(x.id)===id && x.status==='published');if(p)out.push(p);});
  return out.slice(0,Math.max(1,Number(count)||6));
}
function trackProductBuyClick(productId){ trackProductEvent(productId,'click'); }
function subscribeProductAnalytics(){
  if(!supabaseClient||PRODUCT_ANALYTICS_CHANNEL)return;
  try{
    PRODUCT_ANALYTICS_CHANNEL=supabaseClient.channel('storex-product-analytics-live-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'storex_product_analytics'},payload=>{
        const row=payload.new||payload.old; if(!row||!row.product_id)return;
        PRODUCT_ANALYTICS[String(row.product_id)]={views:Number(row.views)||0,clicks:Number(row.clicks)||0,updated_at:row.updated_at};
        const p=PRODUCTS.find(x=>String(x.id)===String(row.product_id));
        if(p){p.views=Number(row.views)||0;p.clicks=Number(row.clicks)||0;}
        if(route().startsWith('/admin-of-storex')) render();
      }).subscribe();
  }catch(e){ console.warn('Product analytics realtime unavailable:',e); }
}
let SETTINGS=null, PRODUCTS=[], CATEGORIES=[], FLASHSALES=[], BANNERS=[], MEDIA=[], PAGES=[], ORDERS=[];
let ORDER_ADMIN_BUSY=false;
let MOBILE_DRAWER_OPEN=false, MOBILE_SEARCH_OPEN=false;
let ADMIN_UNLOCKED=false, ADMIN_VIEW='dashboard', ADMIN_DRAWER_OPEN=false;
let PD_ACTIVE_IMG=0, DRAG_IDX=null;
let HERO_SLIDER_TIMER=null, FLASH_CAROUSEL_TIMERS=[];
let CUSTOMER_PRODUCT_SORT='default';
let ADMIN_ORDER_STATUS_FILTER='all';
let ADMIN_ORDER_STATUS_SORT='newest';
let ADMIN_PRODUCT_STATUS_FILTER='all';
let ADMIN_PRODUCT_STATUS_SORT='default';
const RECENTLY_VIEWED_KEY='StoreX.recentlyViewed.v1';

// ---------- Core utility helpers ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(str){ return String(str||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function isValidHttpUrl(str){ try{ const u=new URL(str); return u.protocol==='http:'||u.protocol==='https:'; }catch(_){ return false; } }
function fmtMoney(value){ const n=Number(value); if(!Number.isFinite(n)) return ''; return 'Rs. '+n.toLocaleString('en-PK'); }

const LOCAL_IMAGE_MAX_BYTES = 4 * 1024 * 1024;


/* ---------- Local image handling ---------- */
/* ---------- Supabase cloud persistence ---------- */
const SUPABASE_URL = 'https://ltxucvenobawwgbjjomx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_qhv4ivoPng9wkw7Qq1ut6Q_lFyPdL2M';
const SUPABASE_BUCKET = 'storex-media';
// Cloud-only persistence: admin data is never stored in the HTML/local browser storage.
const SUPA_SETTING_KEYS = {
  settings:'settings', products:'products', categories:'categories', flashsales:'flashsales',
  banners:'banners', media:'media', pages:'pages'
};
let supabaseClient = null;
let SUPABASE_READY = false;
let SUPABASE_ADMIN = false;

async function initSupabase(){
  if(!window.supabase || typeof window.supabase.createClient!=='function') throw new Error('Supabase library could not load.');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}
  });
  SUPABASE_READY = true;
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session) await refreshAdminStatus();
  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    setTimeout(async()=>{
      if(session) await refreshAdminStatus();
      if(route().startsWith('/admin-of-storex')) render();
    },0);
  });
  subscribeRealtime();
}

async function refreshAdminStatus(){
  SUPABASE_ADMIN=false;
  if(!supabaseClient) return false;
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(!user) return false;
  const {data,error}=await supabaseClient.from('sx_admins').select('user_id').eq('user_id',user.id).maybeSingle();
  if(error) throw error;
  SUPABASE_ADMIN=!!data;
  ADMIN_UNLOCKED=SUPABASE_ADMIN;
  return SUPABASE_ADMIN;
}

function subscribeRealtime(){
  if(!supabaseClient) return;
  try{
    if(SUPABASE_SYNC_CHANNEL){ try{ supabaseClient.removeChannel(SUPABASE_SYNC_CHANNEL); }catch(_){} SUPABASE_SYNC_CHANNEL=null; }
    SUPABASE_SYNC_CHANNEL = supabaseClient.channel('storex-live-sync-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'sx_settings'},payload=>{
        const row=payload.new||payload.old;
        if(!row || !row.key) return;
        applyRemoteSetting(row.key,row.value).catch(err=>console.warn('Realtime update ignored:',err));
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'storex_orders'},payload=>{
        if(!SUPABASE_ADMIN) return;
        const row=payload.new;
        if(row && row.id){ ORDERS=[row,...ORDERS.filter(x=>String(x.id)!==String(row.id))]; if(route().includes('/admin-of-storex') && (ADMIN_VIEW==='orders'||ADMIN_VIEW==='dashboard')){ loadKey(KEYS.products,PRODUCTS).then(v=>{PRODUCTS=v;render();}).catch(()=>render()); } }
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'storex_orders'},payload=>{
        if(!SUPABASE_ADMIN) return;
        const row=payload.new;
        if(row && row.id){ ORDERS=ORDERS.map(x=>String(x.id)===String(row.id)?row:x); if(route().includes('/admin-of-storex') && (ADMIN_VIEW==='orders'||ADMIN_VIEW==='dashboard')) render(); }
      })
      .subscribe();
    loadProductAnalytics();
    subscribeProductAnalytics();
  }catch(err){ console.warn('StoreX realtime unavailable; normal cloud reads remain available.',err); }
}

async function applyRemoteSetting(key,value){
  const map={settings:'SETTINGS',products:'PRODUCTS',categories:'CATEGORIES',flashsales:'FLASHSALES',banners:'BANNERS',media:'MEDIA',pages:'PAGES'};
  const target=map[key];
  if(!target || value==null) return;
  try{
    const clone=JSON.parse(JSON.stringify(value));
    if(target==='SETTINGS'){
      if(!clone || typeof clone!=='object' || Array.isArray(clone)) return;
      SETTINGS=Object.assign({},DEFAULT_SETTINGS,clone,{hero:Object.assign({},DEFAULT_SETTINGS.hero,clone.hero||{}),footer:Object.assign({},DEFAULT_SETTINGS.footer,clone.footer||{},{social:Object.assign({},DEFAULT_SETTINGS.footer.social,(clone.footer&&clone.footer.social)||{})}),search:Object.assign({},DEFAULT_SETTINGS.search,clone.search||{}),darazPromo:Object.assign({},DEFAULT_SETTINGS.darazPromo,clone.darazPromo||{}),mediaSizing:Object.assign({},DEFAULT_SETTINGS.mediaSizing,clone.mediaSizing||{}),invoice:Object.assign({},DEFAULT_SETTINGS.invoice||{},clone.invoice||{})});
    }else{
      if(!Array.isArray(clone)) return;
      window[target]=clone;
    }
    normalizeCloudState();
    applyTheme();
    try{
      if(window.StoreXCustomerCache){
        window.StoreXCustomerCache.write({
          settings:SETTINGS,
          products:PRODUCTS,
          categories:CATEGORIES,
          flashsales:FLASHSALES,
          banners:BANNERS,
          media:MEDIA,
          pages:PAGES
        });
      }
    }catch(e){}
    if(!route().startsWith('/admin-of-storex')){
      render();
      applyMediaSizing();
      initLazyMedia();
    }
  }catch(err){ console.warn('Ignored malformed StoreX realtime payload:',key,err); }
}

async function loadKey(key,fallback){
  if(!SUPABASE_READY) return JSON.parse(JSON.stringify(fallback));
  try{
    const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
    const {data,error}=await supabaseClient.from('sx_settings').select('value').eq('key',cloudKey).maybeSingle();
    if(error) throw error;
    return data && data.value!=null ? JSON.parse(JSON.stringify(data.value)) : JSON.parse(JSON.stringify(fallback));
  }catch(e){
    console.warn('StoreX cloud read failed for',key,e);

async function saveKey(key,val,options={}){
  if(!SUPABASE_READY){ toast('Supabase is not connected. Change was not saved.'); return false; }
  if(!SUPABASE_ADMIN){ toast('Admin session required. Please log in again.'); return false; }
  const cloudKey=SUPA_SETTING_KEYS[key.replace('storex-','').replace('-v2','')]||key;
  try{
    const {error}=await supabaseClient.from('sx_settings').upsert({key:cloudKey,value:JSON.parse(JSON.stringify(val)),updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error) throw error;
    applyTheme();
    if(!options.silent) render();
    return true;
  }catch(e){
    console.error('StoreX cloud save failed:',e);

async function uploadImageToSupabase(file){
  if(!SUPABASE_READY || !supabaseClient) throw new Error('Supabase is not connected.');
  if(!SUPABASE_ADMIN) throw new Error('Admin login is required to upload images.');
  if(!file || !file.type.startsWith('image/')) throw new Error('Please select an image file.');
  const optimized=await StoreXPerf.compressImageForWeb(file);
  const safeName=(optimized.name||file.name||'image').replace(/[^A-Za-z0-9._-]+/g,'-');
  const path='uploads/'+Date.now().toString(36)+'-'+uid()+'-'+safeName;
  const {error}=await supabaseClient.storage.from(SUPABASE_BUCKET).upload(path,optimized,{contentType:optimized.type||file.type||'application/octet-stream',upsert:false,cacheControl:'31536000'});
  if(error) throw error;
  const {data}=supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error('Supabase did not return a public image URL.');
  return data.publicUrl;
}

async function submitStoreOrder(productId, qty, customer, couponCode=''){
  const p=PRODUCTS.find(x=>x.id===productId);
  if(!p) throw new Error('Product not found.');
  const stock=Math.max(0,Number(p.stock)||0);
  const quantity=Math.max(1,Math.min(Number(qty)||1,stock||Number(qty)||1));
  if(stock>0 && quantity>stock) throw new Error('Requested quantity is greater than available stock.');
  const calc=calculateOrder(p,quantity);
  let couponDiscount=0, freeShipping=false, coupon=null;
  if(couponCode){
    const lines=[{line:{qty:quantity},info:{p,unit:calc.unitPrice}}];
    const subtotal=calc.unitPrice*quantity;
    const v=await validateCoupon(couponCode,lines,subtotal);
    if(!v.ok) throw new Error(v.message);
    coupon=v.coupon;
    const cc=computeCouponDiscount(coupon,lines,subtotal); couponDiscount=cc.discount; freeShipping=cc.freeShipping;
  }
  const delivery=freeShipping?0:calc.delivery;
  const total=Math.max(0,calc.unitPrice*quantity-calc.promotionDiscount-couponDiscount)+delivery;
  if(!supabaseClient || !SUPABASE_READY) throw new Error('Order service is temporarily unavailable.');
  const orderNumber='SX-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const payload={order_number:orderNumber,product_id:p.id,product_title:p.title,product_sku:p.sku||null,quantity,unit_price:calc.unitPrice,original_price:calc.originalPrice,special_price:calc.specialPrice,discount_percent:calc.discountPercent,delivery_charges:delivery,discount_amount:Math.round((calc.discountAmount+couponDiscount)*100)/100,total_amount:Math.round(total*100)/100,customer_name:customer.name,customer_phone:customer.phone,customer_email:customer.email||null,city:customer.city,customer_address:customer.address,status:'pending',promotion:normalizeOrderPromotion(buildOrderPromotionJson(calc.promotion, coupon?.code||'', calc.promotionDiscount, !!(freeShipping || (calc.delivery===0 && Number(p.deliveryCharges||0)>0))))};
  let created=false;
  try{
    const rpc=await supabaseClient.rpc('storex_create_order_and_decrement_stock',{p_order:payload});
    if(!rpc.error){created=true;}
    else if(!String(rpc.error.message||'').toLowerCase().includes('function')) throw rpc.error;
  }catch(e){
    if(!String(e?.message||'').toLowerCase().includes('function') && !String(e?.code||'').toLowerCase().includes('pgrst202')) throw e;
  }
  if(!created){
    const {error}=await supabaseClient.from('storex_orders').insert(payload);
    if(error) throw error;
    // Optimistic local update for this browser; the companion stock RPC makes the cloud value authoritative.
    p.stock=Math.max(0,(Number(p.stock)||0)-quantity);
  }else{
    p.stock=Math.max(0,(Number(p.stock)||0)-quantity);
  }
  if(coupon){try{await supabaseClient.from('storex_coupon_usage').insert({coupon_code:coupon.code,customer_phone:customer.phone,customer_email:customer.email||null,order_number:orderNumber});}catch(e){console.warn('Coupon usage log skipped:',e);}}
  return {order_number:orderNumber,created_at:new Date().toISOString(),couponCode:coupon?.code||'',couponDiscount,delivery,total};
}
function calculateOrder(p,quantity){
  const original=Number(p.originalPrice ?? p.oldPrice ?? p.price)||0;
  const special=Number(p.specialPrice ?? p.price)||original;
  const unit=Math.min(original||special,special||original);
  const discountAmount=Math.max(0,(original-unit)*quantity);
  const discountPercent=original>0?Math.round((original-unit)/original*100):0;
  const promo=p.promotion||{};
  let delivery=Math.max(0,Number(p.deliveryCharges)||0);
  let promoDiscount=0, promoText='';
  if(promo.freeDelivery && quantity>=Math.max(1,Number(promo.freeDeliveryQty)||1)){delivery=0;promoText='Free delivery';}
  if(Number(promo.percentOff)>0 && quantity>=Math.max(1,Number(promo.percentOffQty)||1)){
    promoDiscount=Math.round(unit*quantity*Number(promo.percentOff)/100*100)/100; promoText=(promo.percentOff+'% off');
  }
  let bonus=0;
  if(Number(promo.buyQty)>0 && Number(promo.freeQty)>0 && quantity>=Number(promo.buyQty)){
    bonus=Math.floor(quantity/Number(promo.buyQty))*Number(promo.freeQty); promoText=(promoText?promoText+' + ':'')+'Buy '+promo.buyQty+' Get '+promo.freeQty+' Free';
  }
  const subtotal=Math.max(0,unit*quantity-promoDiscount);
  return {originalPrice:original,specialPrice:special,unitPrice:unit,discountAmount:Math.round((discountAmount+promoDiscount)*100)/100,promotionDiscount:promoDiscount,discountPercent,promotion:promoText||null,bonusQuantity:bonus,delivery,total:Math.round((subtotal+delivery)*100)/100};
}

/* ---------- Product promotion totals for cart/checkout ---------- */
function computeProductPromotionTotals(lines){
  let discount=0;
  let freeShipping=false;
  const applied=[];
  for(const x of (lines||[])){
    if(!x || !x.info || !x.info.p) continue;
    const qty=Math.max(1,Number(x.line?.qty)||1);
    const calc=calculateOrder(x.info.p,qty);
    discount+=Number(calc.promotionDiscount)||0;
    const configuredDelivery=Math.max(0,Number(x.info.p.deliveryCharges)||0);
    const promo=x.info.p.promotion||{};
    if(Boolean(promo.freeDelivery) && Number(promo.freeDeliveryQty)>0 && qty>=Number(promo.freeDeliveryQty) && configuredDelivery>0){
      freeShipping=true;
    }
    if(calc.promotion) applied.push({productId:x.info.p.id,text:calc.promotion,discount:Number(calc.promotionDiscount)||0});
  }
  return {discount:Math.round(discount*100)/100,freeShipping,applied};
}
function buildOrderPromotionJson(productPromotionText, couponCode, productPromotionDiscount, freeDelivery){
  const productText=String(productPromotionText||'').trim();
  const coupon=String(couponCode||'').trim();
  if(!productText && !coupon && !(Number(productPromotionDiscount)>0) && !freeDelivery) return null;
  return {
    product_promotion: productText||null,
    product_promotion_discount: Math.round((Number(productPromotionDiscount)||0)*100)/100,
    coupon_code: coupon||null,
    free_delivery: !!freeDelivery
  };
}

/* Keep the checkout payload JSONB-compatible even if an older/local value
   happens to contain promotion as a plain string. */
function normalizeOrderPromotion(value){
  if(value==null || value==='') return null;
  if(typeof value==='string'){
    const text=value.trim();
    if(!text) return null;
    try{
      const parsed=JSON.parse(text);
      return parsed==null?'':parsed;
    }catch(_){
      return text;
    }
  }
  return value;
}

/* ============================================================
   BUY NOW — full-page checkout flow (customer-facing)
   Product page → Delivery Information page → Review Order page →
   Confirm Order → Final Invoice page. Draft state lives in
   sessionStorage only (never localStorage) so it survives a
   reload but never persists long-term.
   ============================================================ */
const BUY_NOW_DRAFT_KEY='StoreX.buyNowDraft.v1';
const BUY_NOW_ORDER_KEY_PREFIX='StoreX.buyNowOrder.';
let BUY_NOW_SUBMITTING=false;
function getBuyNowDraft(){
  try{ const v=JSON.parse(sessionStorage.getItem(BUY_NOW_DRAFT_KEY)||'null'); return v&&typeof v==='object'?v:null; }catch(_){ return null; }
}
function setBuyNowDraft(draft){
  try{ sessionStorage.setItem(BUY_NOW_DRAFT_KEY, JSON.stringify(draft)); }catch(_){ }
}
function clearBuyNowDraft(){
  try{ sessionStorage.removeItem(BUY_NOW_DRAFT_KEY); }catch(_){ }
}
function saveConfirmedBuyNowOrder(orderNumber, payload){
  try{ sessionStorage.setItem(BUY_NOW_ORDER_KEY_PREFIX+String(orderNumber), JSON.stringify(payload)); }catch(_){ }
}
function getConfirmedBuyNowOrder(orderNumber){
  try{ const v=JSON.parse(sessionStorage.getItem(BUY_NOW_ORDER_KEY_PREFIX+String(orderNumber))||'null'); return v&&typeof v==='object'?v:null; }catch(_){ return null; }
}
function buyNowProductHref(p){ return '#/p/'+encodeURIComponent((p&&p.seo&&p.seo.slug)||(p&&p.id)||''); }
function getWhatsAppOrderConfig(){
  const w=(SETTINGS&&SETTINGS.whatsappOrder)||{};
  return {
    enabled:w.enabled!==false,
    number:String(w.number||'923301588630').replace(/[^0-9]/g,''),
    intro:String(w.intro||'I want to order this product. Can I get more details?'),
    includeTitle:w.includeTitle!==false,
    includeSku:w.includeSku!==false,
    includePrice:w.includePrice!==false,
    includeDelivery:w.includeDelivery!==false,
    includeQty:w.includeQty!==false,
    includeLink:w.includeLink!==false
  };
}
function buildWhatsAppOrderMessage(p, qty){
  const cfg=getWhatsAppOrderConfig();
  const lines=[];
  if(cfg.intro) lines.push(cfg.intro);
  lines.push('');
  if(cfg.includeTitle) lines.push('Product: '+(p.shortTitle||p.title||''));
  if(cfg.includeSku && p.sku) lines.push('SKU: '+p.sku);
  var original=Number(p.originalPrice!=null?p.originalPrice:(p.oldPrice!=null?p.oldPrice:p.price))||0;
  var special=Number(p.specialPrice!=null?p.specialPrice:p.price)||original;
  if(cfg.includePrice) lines.push('Price: Rs. '+Number(special).toLocaleString('en-PK'));
  if(cfg.includeDelivery){
    var d=Number(p.deliveryCharges)||0;
    lines.push('Delivery: '+(d>0?('Rs. '+d.toLocaleString('en-PK')):'FREE / as discussed'));
  }
  if(cfg.includeQty) lines.push('Quantity: '+(qty||1));
  if(cfg.includeLink){
    try{
      var slug=(p.seo&&p.seo.slug)||p.id;
      lines.push('Link: '+location.origin+'/#/p/'+encodeURIComponent(slug));
    }catch(e){}
  }
  return lines.join('\n').trim();
}

function checkoutCartViaWhatsApp(){
  try{
    const lines=(typeof CART!=='undefined'?CART:[]).map(function(l){return {line:l, info:cartLineProductInfo(l)};}).filter(function(x){return x.info;});
    if(!lines.length){ toast('Your cart is empty.'); return; }
    const cfg=getWhatsAppOrderConfig();
    if(!cfg.enabled || !cfg.number){ toast('WhatsApp ordering is not configured yet.'); return; }
    const msgLines=[];
    msgLines.push(cfg.intro || 'I want to order these products from my cart.');
    msgLines.push('');
    var subtotal=0, deliveryTotal=0;
    lines.forEach(function(x, i){
      var p=x.info.p, qty=x.line.qty||1, unit=x.info.unit||0, lineTotal=unit*qty;
      subtotal+=lineTotal;
      var d=Number(p.deliveryCharges)||0;
      deliveryTotal+=d;
      msgLines.push((i+1)+') '+(p.shortTitle||p.title||'Product'));
      if(cfg.includeSku && p.sku) msgLines.push('   SKU: '+p.sku);
      if(cfg.includePrice) msgLines.push('   Price: Rs. '+Number(unit).toLocaleString('en-PK')+' x '+qty+' = Rs. '+Number(lineTotal).toLocaleString('en-PK'));
      if(cfg.includeDelivery) msgLines.push('   Delivery: '+(d>0?('Rs. '+Number(d).toLocaleString('en-PK')):'FREE / as discussed'));
      msgLines.push('');
    });
    msgLines.push('Items total: Rs. '+Number(subtotal).toLocaleString('en-PK'));
    msgLines.push('Delivery total: '+(deliveryTotal>0?('Rs. '+Number(deliveryTotal).toLocaleString('en-PK')):'FREE / as discussed'));
    msgLines.push('Grand total: Rs. '+Number(subtotal+deliveryTotal).toLocaleString('en-PK'));
    var url='https://wa.me/'+cfg.number+'?text='+encodeURIComponent(msgLines.join('\n').trim());
    window.open(url, '_blank', 'noopener');
  }catch(e){ console.error(e); toast('Could not open WhatsApp.'); }
}

function startBuyNow(productId, initialQty){
  if(initialQty==null) initialQty=1;
  const p=PRODUCTS.find(x=>x.id===productId); if(!p)return;
  const stock=Math.max(0,Number(p.stock)||0);
  if(stock<=0){ toast('This product is out of stock.'); return; }
  const qty=Math.max(1,Math.min(Number(initialQty)||1,stock));
  try{ if(typeof trackProductBuyClick==='function') trackProductBuyClick(productId); }catch(e){}
  const cfg=getWhatsAppOrderConfig();
  if(!cfg.enabled || !cfg.number){ toast('WhatsApp ordering is not configured yet.'); return; }
  const msg=buildWhatsAppOrderMessage(p, qty);
  const url='https://wa.me/'+cfg.number+'?text='+encodeURIComponent(msg);
  window.open(url, '_blank', 'noopener');
}
function renderBuyNowDeliveryPage(productId){
  setTimeout(function(){ try{startBuyNow(productId,1);}catch(e){} try{location.hash='#/p/'+encodeURIComponent(productId);}catch(e2){} }, 20);
  return (typeof renderPageLoading==='function' ? renderPageLoading('Opening WhatsApp…') : '<p style="padding:40px;text-align:center">Opening WhatsApp…</p>');
}
function updateBuyNowTotal(productId){
  const p=PRODUCTS.find(x=>x.id===productId), q=Math.max(1,Number(document.getElementById('bn-qty')?.value)||1), stock=Math.max(1,Number(p?.stock)||1); if(!p)return;
  const qty=Math.min(q,stock), base=calculateOrder(p,qty);
  const draft=getBuyNowDraft();
  let couponDiscount=0, freeShipping=false, coupon=null;
  const couponCode=draft&&draft.productId===productId?draft.couponCode:'';
  if(couponCode){ coupon=findLoadedCoupon(couponCode); if(coupon){ const result=computeCouponDiscount(coupon,[{line:{qty},info:{p,unit:base.unitPrice}}],base.unitPrice*qty); couponDiscount=result.discount; freeShipping=result.freeShipping; } }
  const delivery=freeShipping?0:base.delivery;
  const total=Math.max(0,base.unitPrice*qty-base.promotionDiscount-couponDiscount)+delivery;
  const a=document.getElementById('bn-price'),b=document.getElementById('bn-delivery'),c=document.getElementById('bn-total'),d=document.getElementById('bn-coupon-discount');
  if(a)a.textContent=money(base.unitPrice)+' × '+qty;
  if(b)b.textContent=delivery?money(delivery):'FREE';
  if(d)d.textContent=couponDiscount?'-'+money(couponDiscount):(coupon?'Applied':'—');
  if(c)c.textContent=money(total);
  if(draft && draft.productId===productId){ draft.qty=qty; setBuyNowDraft(draft); }
}
async function applyBuyNowCoupon(productId){
  const input=document.getElementById('bn-coupon-input'),msg=document.getElementById('bn-coupon-msg');
  const p=PRODUCTS.find(x=>x.id===productId); if(!p||!input)return;
  const qty=Math.max(1,Math.min(Number(document.getElementById('bn-qty')?.value)||1,Math.max(1,Number(p.stock)||1)));
  const lines=directOrderLines(productId,qty),subtotal=lines[0].info.unit*qty;
  const result=await validateCoupon(input.value,lines,subtotal);
  const draft=getBuyNowDraft();
  if(!result.ok){
    if(msg){msg.textContent=result.message;msg.className='coupon-msg err';}
    if(draft && draft.productId===productId){draft.couponCode='';setBuyNowDraft(draft);}
    updateBuyNowTotal(productId);
    return;
  }
  const code=normalizeCouponCode(result.coupon.code);
  if(draft && draft.productId===productId){draft.couponCode=code;setBuyNowDraft(draft);}
  if(msg){msg.textContent='Coupon applied successfully.';msg.className='coupon-msg ok';}
  updateBuyNowTotal(productId);
}

/* ===== Customer details validation (used by every order form) ===== */
function sxValidateCustomer(c){
  var L='A-Za-z\u00C0-\u024F\u0600-\u06FF';
  var name=String(c.name||'').replace(/\s+/g,' ').trim();
  if(!new RegExp('^['+L+']['+L+' .\'\\-]{2,59}$').test(name)||name.replace(new RegExp('[^'+L+']','g'),'').length<3)
    return 'Please enter your valid full name (letters only, at least 3 characters).';
  var ph=String(c.phone||'').replace(/[\s\-()]/g,'');
  if(!/^(?:\+92|0092|92|0)3\d{9}$/.test(ph)||/^(?:\+92|0092|92|0)3(\d)\1{8}$/.test(ph))
    return 'Please enter a valid mobile number, e.g. 0333 1234567 or +92 333 1234567.';
  var em=String(c.email||'').trim();   /* email is optional - only checked when entered */
  if(em&&(!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/.test(em)||/\.\./.test(em)))
    return 'Please enter a valid email address, e.g. name@gmail.com, or leave it empty.';
  var city=String(c.city||'').replace(/\s+/g,' ').trim();
  if(!new RegExp('^['+L+']['+L+' .\'\\-]{2,39}$').test(city))
    return 'Please enter a valid city name (letters only).';
  var ad=String(c.address||'').replace(/\s+/g,' ').trim();
  if(ad.length<10||ad.length>300||!new RegExp('['+L+']{3,}').test(ad))
    return 'Please enter your full delivery address (house/flat, street, area) - at least 10 characters.';
  return '';
}
async function submitBuyNowDelivery(productId){
  const form=document.getElementById('buy-now-delivery-form'); if(!form)return;
  const fd=new FormData(form); const p=PRODUCTS.find(x=>x.id===productId); if(!p)return;
  const stock=Math.max(0,Number(p.stock)||0), qty=Number(fd.get('quantity'))||1;
  if(qty<1||qty>stock){toast('Quantity must be between 1 and available stock.');return;}
  const customer={name:String(fd.get('name')||'').trim(),phone:String(fd.get('phone')||'').trim(),email:String(fd.get('email')||'').trim(),city:String(fd.get('city')||'').trim(),address:String(fd.get('address')||'').trim()};
  if(!customer.name||!customer.phone||!customer.city||!customer.address){toast('Please complete all required fields.');return;}
  {const _e=sxValidateCustomer(customer);if(_e){toast(_e);return;}}
  const draft=getBuyNowDraft();
  let couponCode=(draft&&draft.productId===productId)?(draft.couponCode||''):'';
  if(couponCode){const lines=directOrderLines(productId,qty),subtotal=lines[0].info.unit*qty;const v=await validateCoupon(couponCode,lines,subtotal);if(!v.ok){toast(v.message);return;}}
  setBuyNowDraft({productId,qty,customer,couponCode});
  location.hash='#/buy-now/'+encodeURIComponent(productId)+'/review';
}

async function confirmBuyNowOrder(productId){
  if(BUY_NOW_SUBMITTING) return;
  const draft=getBuyNowDraft();
  if(!draft || draft.productId!==productId){ toast('Your order details could not be found. Please start again.'); location.hash=buyNowProductHref(PRODUCTS.find(x=>x.id===productId)||{id:productId}); return; }
  const p=PRODUCTS.find(x=>x.id===productId); if(!p){ toast('Product not found.'); return; }
  BUY_NOW_SUBMITTING=true;
  const btn=document.getElementById('bn-confirm-btn');
  if(btn){btn.disabled=true;btn.textContent='Confirming Order...';}
  try{
    const result=await submitStoreOrder(draft.productId,draft.qty,draft.customer,draft.couponCode);
    saveConfirmedBuyNowOrder(result.order_number,{order:result,productId:draft.productId,qty:draft.qty,customer:draft.customer,couponCode:draft.couponCode});
    clearBuyNowDraft();
    BUY_NOW_SUBMITTING=false;
    location.hash='#/order-confirmation/'+encodeURIComponent(result.order_number);
  }catch(e){
    console.error(e);
    BUY_NOW_SUBMITTING=false;
    if(btn){btn.disabled=false;btn.textContent='Confirm Order';}
    toast('Order failed: '+(e.message||'Please try again'));
  }
}

function buildDirectOrderInvoiceHtml(order,p,qty,customer,couponCode=''){
  const base=calculateOrder(p,qty);
  const coupon= couponCode ? COUPONS.find(c=>String(c.code||'').toUpperCase()===String(couponCode).toUpperCase()) : null;
  const cc=coupon?computeCouponDiscount(coupon,[{line:{qty},info:{p,unit:base.unitPrice}}],base.unitPrice*qty):{discount:0,freeShipping:false};
  const delivery=cc.freeShipping?0:base.delivery;
  const total={unitPrice:base.unitPrice,delivery,promotionDiscount:base.promotionDiscount,couponDiscount:cc.discount,total:Math.max(0,base.unitPrice*qty-base.promotionDiscount-cc.discount)+delivery};
  const orderNo=order&&order.order_number ? order.order_number : (order&&order.id ? String(order.id) : 'Pending');
  const created=order&&order.created_at ? new Date(order.created_at).toLocaleString('en-PK') : new Date().toLocaleString('en-PK');
  return `<div class="order-invoice" style="background:var(--card);border-radius:14px;padding:22px;max-width:620px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,.12);">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;font-size:13px;"><div><b>Order Number</b><br>${esc(orderNo)}</div><div><b>Order Date</b><br>${esc(created)}</div><div><b>Status</b><br>Pending</div><div><b>Customer</b><br>${esc(customer.name)}</div></div>

function customerCanCancelStatus(status){
  const v=String(status||'pending').toLowerCase();

function customerCanRequestReturn(o){
  const status=String(o?.status||'').toLowerCase();

}

function renderTrackTimeline(o,status){
  if(status==='cancelled') return '<div class="trk-alert off" role="status"><b>Order cancelled.</b> This order will not be delivered.</div>';
  const steps=[['Order Placed','pending'],['Confirmed','confirmed'],['Ready to Ship','ready_to_ship'],['Shipped','shipped'],['Delivered','delivered']];
  const rank={pending:0,confirmed:1,ready_to_ship:2,shipped:3,delivered:4,return_requested:4,returned:4};
  const cur=rank[status]!=null?rank[status]:0;
  const items=steps.map((st,i)=>{const cls=i<cur||(i===cur&&status==='delivered')?'done':i===cur?'current':'';const when=i===0&&o.created_at?`<small>${esc(new Date(o.created_at).toLocaleString())}</small>`:'';return `<li class="${cls}"${cls==='current'?' aria-current="step"':''}><span class="trk-dot">${cls==='done'?'✓':i+1}</span><div><b>${st[0]}</b>${when}</div></li>`;}).join('');
  const extra=status==='return_requested'?'<div class="trk-alert">Return requested — awaiting admin approval.</div>':status==='returned'?'<div class="trk-alert off">This order has been returned.</div>':'';
  return `<ol class="trk-steps" aria-label="Order progress">${items}</ol>${extra}`;
}

st('${esc(o.order_number)}')">Request Cancellation</button></div>`:''}${canReturn?`<div class="modal-close-row" style="justify-content:flex-start;"><button class="btn" onclick="openReturnRequest('${esc(o.order_number)}')">Request Return</button></div>`:''}</div>`;

async function submitReturnRequest(orderNumber){
  const form=document.getElementById('return-request-form'); if(!form)return;
  const reason=String(new FormData(form).get('reason')||'').trim();
  const trackForm=document.getElementById('track-order-form'), cr=trackCredsGet()||{};
  const name=String(trackForm?.querySelector('[name="name"]')?.value||cr.name||'').trim();
  const phone=String(trackForm?.querySelector('[name="phone"]')?.value||cr.phone||'').trim();
  if(!reason){toast('Please enter a return reason.');return;}
  try{
    const {data,error}=await supabaseClient.rpc('storex_request_order_return',{p_order_number:orderNumber,p_customer_name:name,p_customer_phone:phone,p_reason:reason});
    if(error)throw error;
    if(!data||data.success!==true)throw new Error(data?.message||'Return request could not be submitted.');
    try{ await supabaseClient.rpc('storex_mark_customer_return_request',{p_order_number:orderNumber,p_customer_name:name,p_customer_phone:phone}); }catch(_){}
    closeModal(); toast('Return request submitted successfully.'); await refreshOrderView(orderNumber);
  }catch(e){toast(e.message||'Return request failed.');}
}

function requestNoticeHtml(o,status){
  const c=String(o.cancel_request_status||'').toLowerCase(), r=String(o.return_request_status||'').toLowerCase(), out=[];

  if(c==='approved'&&status==='cancelled') out.push('<div class="trk-alert off" role="status" style="margin-top:10px;"><b>Cancellation approved.</b> Your order has been cancelled.</div>');
  if(r==='rejected') out.push('<div class="trk-alert off" role="status" style="margin-top:10px;"><b>Return request not approved.</b></div>');
  if(r==='approved'&&status==='returned') out.push('<div class="trk-alert off" role="status" style="margin-top:10px;"><b>Return approved.</b> Your order has been marked as returned.</div>');

/* ---- timeout helper: nothing network-related may hang the page forever ---- */
function sxTimeout(p,ms,fallbackValue){
  return new Promise(function(resolve){
    var done=false, t=setTimeout(function(){ if(!done){done=true;resolve(fallbackValue);} },ms);
    Promise.resolve(p).then(function(v){ if(!done){done=true;clearTimeout(t);resolve(v);} },
                            function(){ if(!done){done=true;clearTimeout(t);resolve(fallbackValue);} });
  });
}

function loadLazyBackground(el){
  if(!el || el.dataset.lazyLoaded==='1') return;
  const url=el.getAttribute('data-lazy-bg');
  if(!url) return;
  if(el.closest('.hero-bg-slide') && getComputedStyle(el).display==='none') return;   /* desktop/mobile hero image not used on this screen */
  el.style.backgroundImage=`url("${url.replace(/"/g,'\\"')}")`;
  el.dataset.lazyLoaded='1';
  el.removeAttribute('data-lazy-bg');
}

function initLazyMedia(){
  const lazyImages=document.querySelectorAll('img[loading="lazy"]');
  lazyImages.forEach(img=>{ if(!img.getAttribute('src')) img.removeAttribute('loading'); });

  const bgNodes=Array.from(document.querySelectorAll('[data-lazy-bg]')).filter(el=>{ const sl=el.closest('.hero-bg-slide'); return !sl||sl.classList.contains('active'); });
  if(!bgNodes.length) return;
  if(!('IntersectionObserver' in window)){ bgNodes.forEach(loadLazyBackground); return; }
  const io=new IntersectionObserver((entries,observer)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        loadLazyBackground(entry.target);
        observer.unobserve(entry.target);
      }
    });
  },{rootMargin:'120px 0px'});
  bgNodes.forEach(el=>io.observe(el));
}

function sxDarkenHex(hex, amount){
  try{
    hex=String(hex||'').replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    const n=parseInt(hex,16); if(!Number.isFinite(n)) return '#000000';
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.max(0,Math.min(255,Math.round(r*(1-amount))));
    g=Math.max(0,Math.min(255,Math.round(g*(1-amount))));
    b=Math.max(0,Math.min(255,Math.round(b*(1-amount))));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(_){ return hex; }
}

function searchSuggestions(q){
  const query=(q||'').trim().toLowerCase();
  if(!query){return [];}
  const words=query.split(/\s+/).filter(Boolean);
  const configured=SETTINGS.search?.letterSuggestions||{};
  const custom=Object.values(configured).flat();
  const corpus=[...getSearchCorpus(),...custom,...Object.values(BUILTIN_LETTER_SUGGESTIONS).flat()];
  return [...new Set(corpus.filter(Boolean))].map(v=>({v,score:words.reduce((n,w)=>{const x=v.toLowerCase();return n+(x.startsWith(w)?4:(x.includes(w)?2:0));},0)}))
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.v.length-b.v.length)
    .slice(0,Number(SETTINGS.search?.maxSuggestions)||10).map(x=>x.v);
}
function letterSuggestions(){
  const custom=SETTINGS.search?.letterSuggestions||{};
  return Object.fromEntries(Object.keys(BUILTIN_LETTER_SUGGESTIONS).map(k=>[k,[...(custom[k]||[]),...BUILTIN_LETTER_SUGGESTIONS[k]]].filter(Boolean).slice(0,12)));
}
function trendingSearches(){return (SETTINGS.search?.trending||DEFAULT_SETTINGS.search.trending||[]).filter(Boolean).slice(0,12);}
function openSearchSuggestions(input){
  const wrap=input.closest('.search-wrap');
  const box=wrap?.querySelector('.search-suggestions');
  if(!box) return;
  const q=String(input.value||'').trim();
  const suggestions=searchSuggestions(q);
  const trends=trendingSearches();
  const values=q ? suggestions : trends;
  if(!values.length){
    box.innerHTML='<div class="search-suggestions-head">Suggestions</div><div style="padding:12px;color:var(--ink-soft);font-size:12px;">No suggestions yet — keep typing or press Search.</div>';
  }else{
    box.innerHTML='<div class="search-suggestions-head">'+(q?'Suggestions':'Trending searches')+'</div>'+values.map(v=>`<button type="button" class="search-suggestion" data-search-value="${esc(v)}" aria-label="Search ${esc(v)}" onclick="event.preventDefault();event.stopPropagation();performSearchQuery(this.getAttribute('data-search-value')||'');"><span>${esc(v)}</span><small>${q?'Search':'Trending'}</small></button>`).join('');
  }
  box.classList.add('open');
}

function performSearchQuery(v){
  const query=String(v||'').trim();
  if(!query) return false;
  // Always put the selected keyword into the visible search box first.
  document.querySelectorAll('.search-form input[name="q"]').forEach(input=>{ input.value=query; });
  document.querySelectorAll('.search-suggestions').forEach(box=>box.classList.remove('open'));
  // Keep the search field open on mobile after selecting a suggestion.
  MOBILE_SEARCH_OPEN=true;
  const target='/search?q='+encodeURIComponent(query);
  if(route()===target){
    render();
  }else{
    location.hash=target;
  }
  return false;
}
function useSearchSuggestion(v){
  return performSearchQuery(v);

let SX_LAZY_SECS={};
function renderHome(){
  const secs=(SETTINGS.sections||[]).filter(s=>s&&s.visible);
  SX_LAZY_SECS={};
  if(!('IntersectionObserver' in window)) return secs.map(renderSection).join('');
  /* hero + the first two sections are drawn at once; every section below is drawn only when the visitor scrolls near it */
  return secs.map((sec,i)=>{
    const html=renderSection(sec);
    if(!html||i<3||sec.type==='hero') return html;
    const k='ls'+i; SX_LAZY_SECS[k]=html;
    return `<div class="sx-lazy-sec" data-sx-lazy="${k}"></div>`;
  }).join('');
}
function initLazySections(){
  const nodes=document.querySelectorAll('.sx-lazy-sec[data-sx-lazy]');
  if(!nodes.length) return;
  const fill=el=>{
    const k=el.getAttribute('data-sx-lazy'), html=SX_LAZY_SECS[k]; delete SX_LAZY_SECS[k];
    if(html==null){ el.remove(); return; }
    const t=document.createElement('template'); t.innerHTML=sxLazyImgs(html);
    Array.from(t.content.children).forEach(c=>c.classList.add('sx-sec-in'));
    el.replaceWith(t.content);
    startCountdowns(); initFlashCarousels(); initFlashVisuals(); initLazyMedia();
  };
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); fill(e.target); } });
  },{rootMargin:'1500px 0px'});
  nodes.forEach(n=>io.observe(n));
}
function renderSection(sec){
  try{ return renderSectionRaw(sec); }
  catch(err){ window.sxReportError&&window.sxReportError('section "'+(sec&&sec.type)+'"',err); return ''; }
}

  switch(sec.type){

    case 'social': return renderSocialSection(sec);

}

function initHeroSlider(){
  if(HERO_SLIDER_TIMER){ clearInterval(HERO_SLIDER_TIMER); HERO_SLIDER_TIMER=null; }
  const wrap = document.querySelector('.hero-bg');
  if(!wrap) return;
  const slides = wrap.querySelectorAll('.hero-bg-slide');
  if(slides.length<2) return;
  let idx = 0;
  HERO_SLIDER_TIMER = setInterval(()=>{
    slides[idx].classList.remove('active');
    idx = (idx+1) % slides.length;
    slides[idx].classList.add('active');
    slides[idx].querySelectorAll('[data-lazy-bg]').forEach(loadLazyBackground);
  }, 5000);
