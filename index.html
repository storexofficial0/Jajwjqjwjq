function initFlashCarousels(){
  FLASH_CAROUSEL_TIMERS.forEach(t=>clearInterval(t));
  FLASH_CAROUSEL_TIMERS = [];
  document.querySelectorAll('.flash-carousel').forEach(wrap=>{
    const track = wrap.querySelector('.flash-track');
    const slides = wrap.querySelectorAll('.flash-slide');
    const dots = wrap.querySelectorAll('.flash-dots button');
    if(!track || slides.length<2) return;
    let idx = 0;
    const goTo = (i)=>{
      idx = i;
      track.style.transform = `translateX(-${idx*100}%)`;
      dots.forEach((d,di)=>d.classList.toggle('active', di===idx));
    };
    dots.forEach(d=>d.addEventListener('click', (e)=>{ e.preventDefault(); goTo(Number(d.getAttribute('data-dot'))); }));
    const timer = setInterval(()=>{ goTo((idx+1) % slides.length); }, 5000);
    FLASH_CAROUSEL_TIMERS.push(timer);
  });
}

function filteredProducts(filter){
  // Homepage collections should only show products that are currently in stock.
  // Out-of-stock products remain available in the full All Products catalog.
  let list = PRODUCTS.filter(p=>p.status==='published' && Math.max(0,Number(p.stock)||0)>0);
  if(filter==='featured') list = list.filter(p=>p.featured);
  else if(filter==='trending') list = list.filter(p=>p.trending);
  else if(filter==='newArrival') list = list.filter(p=>p.newArrival);
  else if(filter==='bestSeller') list = list.filter(p=>p.bestSeller);
  const posOf=p=>{const n=Number(p.sectionPos&&p.sectionPos[filter]);return n>0?n:1e9;};
  return list.sort((a,b)=>(posOf(a)-posOf(b))||((a.order||0)-(b.order||0)));
}

function sxLayoutCfg(cfg){

  let url=String(c.viewAllUrl||'').trim();
  if(url && !(/^#\//.test(url)||/^https?:\/\//i.test(url))) url='';
  return {
    mode:c.layoutMode==='grid'?'grid':'horizontal',
    count:n(c.initialCount,4,1,24),
    dcols:[2,3,4].includes(Number(c.desktopCols))?Number(c.desktopCols):2,

function shuffleProducts(arr){
  const a=Array.isArray(arr)?arr.slice():[];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function getRandomProducts(arr, count){
  const n=Math.max(0, Number(count)||0);
  return shuffleProducts(arr).slice(0, n);
}

function safeRichHtml(html){
  let s=String(html||'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi,'');
  s=s.replace(/<\s*(script|iframe|object|embed|form|link|meta)[^>]*\/?\s*>/gi,'');
  s=s.replace(/\son[a-z]+\s*=\s*(['"]).*?\1/gi,'');
  s=s.replace(/\s(href|src)\s*=\s*(['"])\s*javascript:[\s\S]*?\2/gi,'');
  return s;
}

function renderProductCard(p, options={}){
  const img=p.mainImage?mediaSrc(p.mainImage):(p.images&&p.images[0]?mediaSrc(p.images[0]):'');

function seededShuffleProducts(arr,seed){
  const a=Array.isArray(arr)?arr.slice():[]; let h=2166136261; const str=String(seed||'');
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  let t=h>>>0; const rnd=()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}
  return a;
}
/* Two scrolling rows of other products; the mix is seeded by the product id so every product page shows its own set. */
function buildProductRecommendationRows(p){
  const eligible=PRODUCTS.filter(x=>x.status==='published'&&x.id!==p.id&&Math.max(0,Number(x.stock)||0)>0);
  const same=seededShuffleProducts(eligible.filter(x=>productsShareCategory(x,p)),p.id);
  const others=seededShuffleProducts(eligible.filter(x=>!productsShareCategory(x,p)),p.id);
  const all=[...same,...others];
  if(!all.length)return [];
  const per=Math.min(10,Math.ceil(all.length/2));
  return [all.slice(0,per),all.slice(per,per*2)].filter(r=>r.length);
}
function buildProductRecommendations(p, count){
  const n=Math.max(0,Number(count)||6);
  const eligible = PRODUCTS.filter(x=>x.status==='published' && x.id!==p.id && Math.max(0,Number(x.stock)||0)>0);
  const sameCategory = shuffleProducts(eligible.filter(x=>productsShareCategory(x,p)));
  const others = shuffleProducts(eligible.filter(x=>!productsShareCategory(x,p)));
  const pool = [...sameCategory, ...others];
  const seen = new Set();
  const out = [];
  for(const item of pool){
    if(seen.has(item.id)) continue;
    seen.add(item.id);
    out.push(item);
    if(out.length>=n) break;
  }
  return out;
}

function storexBaseSortCustomerProducts(list){
  const arr=[...list];
  const stockFirst=(a,b)=>(Math.max(0,Number(b.stock)||0)>0?1:0)-(Math.max(0,Number(a.stock)||0)>0?1:0);
  switch(CUSTOMER_PRODUCT_SORT){
    case 'price-low': return arr.sort((a,b)=>(Number(a.specialPrice??a.price)||0)-(Number(b.specialPrice??b.price)||0));
    case 'price-high': return arr.sort((a,b)=>(Number(b.specialPrice??b.price)||0)-(Number(a.specialPrice??a.price)||0));
    case 'newest': return arr.sort((a,b)=>Number(b.created_at?new Date(b.created_at).getTime():b.order||0)-Number(a.created_at?new Date(a.created_at).getTime():a.order||0));
    case 'discount': return arr.sort((a,b)=>{const da=Number(a.discount)||0,db=Number(b.discount)||0;return db-da;});
    case 'name': return arr.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
    default: return arr.sort((a,b)=>stockFirst(a,b)||(a.order||0)-(b.order||0));
  }
}

/* ================= COUNTDOWN ================= */
let COUNTDOWN_TIMER = null;
function startCountdowns(){
  if(COUNTDOWN_TIMER) clearInterval(COUNTDOWN_TIMER);
  const tick = ()=>{
    document.querySelectorAll('[data-countdown]').forEach(el=>{
      const end = el.getAttribute('data-countdown');
      if(!end) return;
      const diff = new Date(end).getTime() - Date.now();
      if(diff<=0){ el.innerHTML = '<div class="chip" style="min-width:auto;padding:8px 14px;">Sale ended</div>'; return; }
      const d = Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60, s=Math.floor(diff/1000)%60;
      const dEl=el.querySelector('.d'),hEl=el.querySelector('.h'),mEl=el.querySelector('.m'),sEl=el.querySelector('.s');
      if(dEl){dEl.textContent=String(d).padStart(2,'0');hEl.textContent=String(h).padStart(2,'0');mEl.textContent=String(m).padStart(2,'0');sEl.textContent=String(s).padStart(2,'0');}
    });
  };
  tick(); COUNTDOWN_TIMER = setInterval(tick,1000);
}

function wireStorefrontEvents(){
  // Event delegation keeps storefront controls working after every hash-route render.
  // Most controls use inline handlers, but delegation covers links/forms that are
  // dynamically replaced and makes local-file Chrome usage more reliable.
  const app=document.getElementById('app');
  if(!app || app.dataset.StoreXWired==='1') return;
  app.dataset.StoreXWired='1';
  app.addEventListener('click',e=>{
    const a=e.target.closest('a[href^="#/"]');
    if(a){
      const href=a.getAttribute('href');
      if(href){ e.preventDefault(); location.hash=href.slice(1)||'/'; }
    }
  });
  app.addEventListener('submit',e=>{
    const form=e.target.closest('.search-form');
    if(!form) return;
    e.preventDefault();
    const input=form.querySelector('input[name="q"]');
    const q=(input?.value||'').trim();
    if(q) location.hash='/search?q='+encodeURIComponent(q);
  });
}

async function handleMediaPickerFile(input){
  const files=Array.from(input?.files||[]);
  if(!files.length)return;
  const status=document.getElementById('media-picker-status');
  if(status)status.textContent='Uploading image'+(files.length>1?'s':'')+'…';
  input.disabled=true;
  try{
    const urls=[];
    for(const file of files){
      if(!file.type.startsWith('image/'))continue;
      const url=await uploadImageToSupabase(file);
      await rememberMediaUrl(url,file.name||'image');
      urls.push(url);
    }
    if(MEDIA_PICKER_MULTIPLE){
      const cb=MEDIA_PICKER_CALLBACK;
      if(typeof cb==='function' && urls.length)cb(urls);
      closeMediaPicker();
      toast((urls.length||0)+' image'+(urls.length===1?'':'s')+' selected successfully ✓');
    }else{
      const cb=MEDIA_PICKER_CALLBACK;
      closeMediaPicker();
      if(typeof cb==='function'&&urls[0])cb(urls[0]);
      toast('Image selected successfully ✓');
    }
  }catch(e){
    console.error('Media picker upload failed:',e);
    if(status)status.textContent='Upload failed. You can try again.';
    toast('Image upload failed: '+(e.message||'Unknown error'));
    input.disabled=false;
    input.value='';
  }
}
function selectMediaForField(id){
  const url=mediaSrc(id);
  if(!url)return;
  if(MEDIA_PICKER_MULTIPLE){
    const idx=MEDIA_PICKER_SELECTED.indexOf(id);
    if(idx>=0)MEDIA_PICKER_SELECTED.splice(idx,1); else MEDIA_PICKER_SELECTED.push(id);
    const btn=document.getElementById('media-pick-'+id);
    if(btn)btn.classList.toggle('sel',MEDIA_PICKER_SELECTED.includes(id));
    const status=document.getElementById('media-picker-status');
    if(status)status.textContent=MEDIA_PICKER_SELECTED.length+' image'+(MEDIA_PICKER_SELECTED.length===1?'':'s')+' selected';
    return;
  }
  const cb=MEDIA_PICKER_CALLBACK;
  closeMediaPicker();
  if(typeof cb==='function')cb(url);
}
function finishMediaPicker(){
  const urls=MEDIA_PICKER_SELECTED.map(id=>mediaSrc(id)).filter(Boolean);
  const cb=MEDIA_PICKER_CALLBACK;
  closeMediaPicker();
  if(typeof cb==='function')cb(urls);
}

/* ---------- Admin: change position of products / categories / flash sales / banners ---------- */
function adminOrderedList(kind){
  if(kind==='product')return [...PRODUCTS].sort((a,b)=>(a.order||0)-(b.order||0));
  if(kind==='category')return [...CATEGORIES].sort((a,b)=>(a.order||0)-(b.order||0));
  if(kind==='flash')return FLASHSALES;
  if(kind==='banner')return BANNERS;
  return [];
}
function adminPositionControl(kind,id,total){
  const pos=adminOrderedList(kind).findIndex(x=>String(x.id)===String(id))+1;
  return `<div class="pos-ctl"><button type="button" class="pos-btn" title="Move up" aria-label="Move up" onclick="adminMoveItem('${kind}','${id}',-1)">&#9650;</button><input class="pos-input" type="number" inputmode="numeric" min="1" max="${total}" value="${pos}" aria-label="Position" onchange="adminSetPosition('${kind}','${id}',this.value)"><button type="button" class="pos-btn" title="Move down" aria-label="Move down" onclick="adminMoveItem('${kind}','${id}',1)">&#9660;</button></div>`;
}
function adminMoveItem(kind,id,dir){
  const list=adminOrderedList(kind); const i=list.findIndex(x=>String(x.id)===String(id)); if(i<0)return;
  adminSetPosition(kind,id,i+1+dir);
}
function adminSetPosition(kind,id,position){
  const list=adminOrderedList(kind).slice(); const n=list.length;
  const from=list.findIndex(x=>String(x.id)===String(id)); if(from<0)return;
  let to=Math.round(Number(position)); if(!Number.isFinite(to))return;
  to=Math.max(1,Math.min(n,to))-1; if(to===from){render();return;}
  const [moved]=list.splice(from,1); list.splice(to,0,moved);
  if(kind==='product'){ list.forEach((x,k)=>{x.order=k+1;}); saveKey(KEYS.products,PRODUCTS); }
  else if(kind==='category'){ list.forEach((x,k)=>{x.order=k+1;}); saveKey(KEYS.categories,CATEGORIES); }
  else if(kind==='flash'){ FLASHSALES=list; saveKey(KEYS.flashsales,FLASHSALES); }
  else if(kind==='banner'){ BANNERS=list; saveKey(KEYS.banners,BANNERS); }
  toast('Moved to position '+(to+1));
}

function getProductImageDraft(pid,isNew){
  return isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
}
function persistProductImageEdit(isNew){
  if(!isNew) saveKey(KEYS.products,PRODUCTS,{silent:true});
}
function renderProductImageEditor(p,isNew){
  const images=Array.isArray(p?.images)?p.images:[];
  if(!images.length) return '<div style="grid-column:1/-1;color:var(--ink-soft);font-size:12px;padding:8px 0;">No images added yet.</div>';
  return images.map((im,index)=>`
    <div class="product-image-item ${p.mainImage===im?'is-main':''}">
      <img src="${esc(mediaSrc(im))}" alt="Product image ${index+1}">
      <span class="image-number">Image ${index+1}${p.mainImage===im?' · Main':''}</span>
      <div class="image-tools">
        <button type="button" onclick="setMainProductImage('${esc(p.id)}','${esc(im)}',${isNew})">Set Main</button>
        <button type="button" onclick="moveProductImage('${esc(p.id)}',${index},-1,${isNew})" ${index===0?'disabled':''}>↑</button>
        <button type="button" onclick="moveProductImage('${esc(p.id)}',${index},1,${isNew})" ${index===images.length-1?'disabled':''}>↓</button>
        <button type="button" class="danger" onclick="deleteProductImage('${esc(p.id)}',${index},${isNew})">Delete</button>
      </div>
    </div>`).join('');
}
function refreshProductImageEditor(pid,isNew){
  const p=getProductImageDraft(pid,isNew);
  const list=document.getElementById('product-img-list-'+pid);
  if(list&&p)list.innerHTML=renderProductImageEditor(p,isNew);
}
function addProductImage(pid, mediaId, isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!mediaId)return;
  p.images=Array.isArray(p.images)?p.images:[];
  if(!p.images.includes(mediaId))p.images.push(mediaId);
  if(!p.mainImage)p.mainImage=mediaId;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function setMainProductImage(pid, mediaId, isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p)return;
  p.images=Array.isArray(p.images)?p.images:[];
  if(p.images.includes(mediaId))p.mainImage=mediaId;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function moveProductImage(pid,index,direction,isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!Array.isArray(p.images))return;
  const next=index+direction;
  if(index<0||next<0||index>=p.images.length||next>=p.images.length)return;
  const [item]=p.images.splice(index,1);
  p.images.splice(next,0,item);
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}
function deleteProductImage(pid,index,isNew){
  const p=getProductImageDraft(pid,isNew);
  if(!p||!Array.isArray(p.images)||index<0||index>=p.images.length)return;
  const removed=p.images[index];
  if(!confirm('Delete Image '+(index+1)+' from this product?'))return;
  p.images.splice(index,1);
  if(p.mainImage===removed)p.mainImage=p.images[0]||null;
  if(!p.images.length)p.mainImage=null;
  persistProductImageEdit(isNew);
  refreshProductImageEditor(pid,isNew);
}

function saveProductForm(pid, isNew){
  const form = document.getElementById('product-form');
  const fd = new FormData(form);
  const draft = isNew ? window.__draftProduct : PRODUCTS.find(x=>x.id===pid);
  const title = fd.get('title').trim();
  const originalPrice=Number(fd.get('originalPrice')||0), specialPrice=Number(fd.get('specialPrice')||originalPrice), stock=Math.max(0,Number(fd.get('stock')||0));
  if(originalPrice<0 || specialPrice<0 || specialPrice>originalPrice){ toast('Special price must be between 0 and original price.'); return; }
  const autoDiscount=originalPrice>0?Math.round((originalPrice-specialPrice)/originalPrice*100):0;
  draft.images=Array.isArray(draft.images)?draft.images.filter(Boolean):[];
  if(draft.mainImage && !draft.images.includes(draft.mainImage))draft.mainImage=draft.images[0]||null;
  if(!draft.mainImage && draft.images.length)draft.mainImage=draft.images[0];
  Object.assign(draft, {
    title, shortTitle: fd.get('shortTitle').trim(),
    shortDesc: fd.get('shortDesc').trim(), fullDesc: fd.get('fullDesc').trim(),
    categories: fd.getAll('categories').filter(Boolean), category: (fd.getAll('categories').filter(Boolean)[0]||''), tags: sxNormTags(fd.get('tags')),
    price:specialPrice, oldPrice:originalPrice, originalPrice, specialPrice, stock, deliveryCharges:Math.max(0,Number(fd.get('deliveryCharges')||0)),
    discount:autoDiscount, badge:autoDiscount?'-'+autoDiscount+'%':fd.get('badge').trim(),
    promotion:{title:String(fd.get('promotionTitle')||'').trim(),freeDelivery:Number(fd.get('freeDeliveryQty')||0)>0,freeDeliveryQty:Number(fd.get('freeDeliveryQty')||0),percentOff:Math.max(0,Number(fd.get('percentOff')||0)),percentOffQty:Math.max(0,Number(fd.get('percentOffQty')||0)),buyQty:Math.max(0,Number(fd.get('buyQty')||0)),freeQty:Math.max(0,Number(fd.get('freeQty')||0))},
    status: fd.get('status'), order: Number(fd.get('order'))||0,
    featured: fd.get('featured')==='on', trending: fd.get('trending')==='on', newArrival: fd.get('newArrival')==='on', bestSeller: fd.get('bestSeller')==='on',
    sectionPos: (()=>{const o={};['featured','trending','newArrival','bestSeller'].forEach(k=>{const n=Math.floor(Number(fd.get('pos_'+k)));if(n>0)o[k]=n;});return o;})(),
    seo: { slug: slugify(fd.get('seoSlug').trim() || title), title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ PRODUCTS.push(draft); window.__draftProduct=null; }
  saveKey(KEYS.products, PRODUCTS);
  closeModal(); toast('Product saved in this session');
}

function adminOrderActions(o){
  const s=String(o.status||'pending').toLowerCase();
  const btns=[];
  if(s==='pending') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','confirmed')">Confirm</button>`);
  if(s==='confirmed') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','ready_to_ship')">Ready to Ship</button>`);
  if(s==='ready_to_ship') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','shipped')">Shipped</button>`);
  if(s==='shipped') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','delivered')">Delivered</button>`);
  if(s==='pending'||s==='confirmed') btns.push(`<button class="btn small danger" onclick="updateOrderStatus('${o.id}','cancelled')">Cancel</button>`);
  if(orderCancelPending(o)) btns.push(`<button class="btn small" onclick="reviewOrderRequest('${o.id}','cancel','approve')">Approve Cancel</button><button class="btn small danger" onclick="reviewOrderRequest('${o.id}','cancel','reject')">Reject Cancel</button>`);
  if(orderReturnPending(o)) btns.push(`<button class="btn small" onclick="reviewOrderRequest('${o.id}','return','approve')">Approve Return</button><button class="btn small danger" onclick="reviewOrderRequest('${o.id}','return','reject')">Reject Return</button>`);
  if(s==='delivered') btns.push(`<button class="btn small" onclick="updateOrderStatus('${o.id}','returned')">Mark Returned</button>`);
  return btns.join(' ');
}

lick="openInvoiceEditor('${o.id}')">Invoice</button>${adminOrderActions(o)}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><div class="icon">📦</div><h3>No matching orders</h3><p>Change the status filter.</p></div>'}</div>`;

async function loadHtml2Canvas(){
  if(window.html2canvas) return window.html2canvas;
  await new Promise((resolve,reject)=>{

  });
  return window.html2canvas;
}

function showOrderDetails(id){ const o=ORDERS.find(x=>String(x.id)===String(id)); if(!o)return; loadInvoiceSettings().then(()=>showModal(`<h2>Order Details</h2><div style="display:grid;gap:7px;font-size:13px"><b>Order: ${esc(o.order_number||o.id||'')}</b><b>${esc(o.product_title||'')}</b><span>Name: ${esc(o.customer_name||'')}</span><span>Phone: ${esc(o.customer_phone||'')}</span><span>Email: ${esc(o.customer_email||'')}</span><span>City: ${esc(o.city||'')}</span><span>Full delivery address: ${esc(o.customer_address||'')}</span><span>Quantity: ${Number(o.quantity)||0}</span><span>Delivery: ${money(o.delivery_charges)}</span><span>Total: <b>${money(o.total_amount)}</b></span><span>Status: ${formatOrderStatus(o.status)}</span>${isOrderRequestAlert(o)?`<div style="margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#FFF9F3;"><b>Request alert</b><div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Remove this request from the Dashboard alerts after you have reviewed it.</div></div>`:''}${o.return_reason?`<span>Return reason: ${esc(o.return_reason)}</span>`:''}${o.cancel_reason?`<span>Cancellation reason: ${esc(o.cancel_reason)}</span>`:''}${o.cancel_request_status?`<span>Cancellation request: ${esc(o.cancel_request_status)}</span>`:''}${o.return_request_status?`<span>Return request: ${esc(o.return_request_status)}</span>`:''}${o.return_requested_at?`<span>Return requested: ${esc(new Date(o.return_requested_at).toLocaleString())}</span>`:''}</div><div class="invoice-detail-export"><h3 style="margin:0 0 8px">Invoice</h3><div class="invoice-detail-preview">${invoicePreviewBody(o)}</div><div class="invoice-detail-actions"><button class="btn" onclick="saveAndPrintInvoice('${o.id}')">Export PDF</button><button class="btn ghost" onclick="exportInvoiceImage('${o.id}')">Export Image (PNG)</button><button class="btn ghost" onclick="openInvoiceEditor('${o.id}')">Edit Invoice</button></div></div><div class="modal-close-row">${adminOrder async function updateOrderStatus(id,status){ if(!SUPABASE_ADMIN||!supabaseClient)return; try{ const allowed=['pending','confirmed','ready_to_ship','shipped','delivered','cancelled','return_requested','returned']; if(!allowed.includes(status))throw new Error('Invalid order status.'); let rpcError=null; try{ const rpc=await supabaseClient.rpc('storex_sync_order_stock',{p_order_key:String(id),p_new_status:status}); rpcError=rpc.error||null; }catch(e){rpcError=e;} if(rpcError){ const {error}=await supabaseClient.from('storex_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id); if(error)throw error; } const o=ORDERS.find(x=>String(x.id)===String(id)); if(o)o.status=status; closeModal(); await loadOrders(); render(); toast('Order status updated: '+formatOrderStatus(status)); }catch(e){toast('Order update failed: '+(e.message||'Unknown error'));} }

async function reviewOrderRequest(id,kind,decision){
  if(!SUPABASE_ADMIN||!supabaseClient)return;
  const o=ORDERS.find(x=>String(x.id)===String(id)); if(!o)return;
  const label=kind==='cancel'?'cancellation':'return';
  if(!confirm((decision==='approve'?'Approve':'Reject')+' the '+label+' request for order '+(o.order_number||'')+'?'))return;
  const now=new Date().toISOString();
  const saveFlag=async patch=>{const {error}=await supabaseClient.from('storex_orders').update(Object.assign({request_reviewed_at:now,updated_at:now},patch)).eq('id',id); if(error)throw error;};
  try{
    if(decision==='approve'){
      await updateOrderStatus(id,kind==='cancel'?'cancelled':'returned');
      const after=ORDERS.find(x=>String(x.id)===String(id));
      if(!after||String(after.status).toLowerCase()!==(kind==='cancel'?'cancelled':'returned')) return;
      await saveFlag(kind==='cancel'?{cancel_request_status:'approved'}:{return_request_status:'approved'});
    } else if(kind==='cancel'){
      await saveFlag({cancel_request_status:'rejected'});
    } else {
      await saveFlag({status:'delivered',return_request_status:'rejected'});
    }
    closeModal(); await loadOrders(); render();
    toast('Request '+(decision==='approve'?'approved':'rejected')+'. Order status updated.');
  }catch(e){toast('Request update failed: '+(e.message||'Unknown error')+'. If columns are missing, run phase-2.sql in Supabase.');}
}

async function saveCouponForm(id,isNew,form){
  if(!supabaseClient||!SUPABASE_READY){toast('Supabase is not available.');return;}
  const fd=new FormData(form);
  const scope=fd.get('applicable_scope')||'all';
  let ids=[];
  if(scope==='products') ids=[...form.querySelector('[name=applicable_products]').selectedOptions].map(o=>o.value);
  else if(scope==='categories') ids=[...form.querySelector('[name=applicable_categories]').selectedOptions].map(o=>o.value);
  const payload={
    code:String(fd.get('code')||'').trim().toUpperCase(),
    description:String(fd.get('description')||'').trim(),
    discount_type:fd.get('discount_type'),
    discount_value:Number(fd.get('discount_value'))||0,
    min_order:Number(fd.get('min_order'))||0,
    max_discount:fd.get('max_discount')?Number(fd.get('max_discount')):null,
    starts_at:(function(){const s=String(fd.get('starts_at')||'').trim();if(!s)return null;const d=new Date(s.includes('T')?s:s+'T00:00:00');return isNaN(d.getTime())?null:d.toISOString();})(),
    ends_at:(function(){const s=String(fd.get('ends_at')||'').trim();if(!s)return null;const d=new Date(s.includes('T')?s:s+'T23:59:59');return isNaN(d.getTime())?null:d.toISOString();})(),
    usage_limit:fd.get('usage_limit')?Number(fd.get('usage_limit')):null,
    per_customer_limit:fd.get('per_customer_limit')?Number(fd.get('per_customer_limit')):null,
    active:fd.get('active')==='on',
    applicable_scope:scope,
    applicable_ids:ids,
    title:String(fd.get('title')||'').trim(),
    visibility:fd.get('visibility')==='private'?'private':'public',
    free_shipping:fd.get('free_shipping')==='on',
    first_order_only:fd.get('first_order_only')==='on'
  };
  if(!payload.code){toast('Please enter a coupon code.');return;}
  try{
    if(isNew){
      const {error}=await supabaseClient.from('storex_coupons').insert(payload);
      if(error) throw error;
    }else{
      const {error}=await supabaseClient.from('storex_coupons').update(payload).eq('id',id);
      if(error) throw error;
    }
    closeModal(); toast('Coupon saved ✓');
    await loadAdminCoupons(); await loadCoupons(); render();
  }catch(e){ toast('Coupon save failed: '+(e.message||'Unknown error')); }
}
async function toggleCouponActive(id,active){
  if(!supabaseClient||!SUPABASE_READY)return;
  try{ const {error}=await supabaseClient.from('storex_coupons').update({active}).eq('id',id); if(error)throw error;
    await loadAdminCoupons(); await loadCoupons(); render(); toast(active?'Coupon enabled':'Coupon disabled');
  }catch(e){ toast('Update failed: '+(e.message||'Unknown error')); }
}
async function deleteCoupon(id){
  if(!confirm('Delete this coupon? This cannot be undone.')) return;
  if(!supabaseClient||!SUPABASE_READY)return;
  try{ const {error}=await supabaseClient.from('storex_coupons').delete().eq('id',id); if(error)throw error;
    await loadAdminCoupons(); await loadCoupons(); render(); toast('Coupon deleted');
  }catch(e){ toast('Delete failed: '+(e.message||'Unknown error')); }
}

function saveCategoryForm(id, isNew){
  const form = document.getElementById('category-form'); const fd = new FormData(form);
  const draft = isNew ? window.__draftCategory : CATEGORIES.find(x=>x.id===id);
  const name = fd.get('name').trim();
  Object.assign(draft, {
    name, slug: slugify(fd.get('slug').trim() || name), description: fd.get('description').trim(),
    icon: fd.get('icon').trim(), order: Number(fd.get('order'))||0, status: fd.get('status'), homeFeatured:fd.get('homeFeatured')==='on',
    seo: { title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ CATEGORIES.push(draft); window.__draftCategory=null; }
  const pickedIds = new Set(fd.getAll('catProducts'));
  let productsChanged=false;
  PRODUCTS.forEach(p=>{
    const ids=productCatIds(p), has=ids.includes(draft.id), want=pickedIds.has(p.id);
    if(want && !has){ ids.push(draft.id); p.categories=ids; p.category=ids[0]||''; productsChanged=true; }
    else if(!want && has){ const next=ids.filter(x=>x!==draft.id); p.categories=next; p.category=next[0]||''; productsChanged=true; }
  });
  if(productsChanged) saveKey(KEYS.products, PRODUCTS);
  if(draft.homeFeatured){ if(!Array.isArray(SETTINGS.homeCategoryIds)) SETTINGS.homeCategoryIds=[]; if(!SETTINGS.homeCategoryIds.includes(draft.id)) SETTINGS.homeCategoryIds.push(draft.id); if(SETTINGS.homeCategoryIds.length>6){ SETTINGS.homeCategoryIds=SETTINGS.homeCategoryIds.slice(0,6); toast('Only 6 home categories are allowed.'); } }else if(Array.isArray(SETTINGS.homeCategoryIds)){ SETTINGS.homeCategoryIds=SETTINGS.homeCategoryIds.filter(x=>x!==draft.id); }
   saveKey(KEYS.categories, CATEGORIES); saveKey(KEYS.settings, SETTINGS); closeModal(); toast('Category saved');
}

function renderFlashProductsList(f){
  if(!f.products || !f.products.length) return '<p style="font-size:13px;color:var(--ink-soft);">No products added yet.</p>';
  return f.products.map((entry,i)=>{
    const label = entry.type==='existing' ? (PRODUCTS.find(p=>p.id===entry.productId)||{}).title || 'Unknown product' : entry.title+' (custom)';
    return `<div class="section-list-item" style="cursor:default;"><span class="meta"><b>${esc(label)}</b></span><button type="button" class="btn small danger" onclick="removeFlashProduct('${f.id}',${i})">Remove</button></div>`;
  }).join('');
}

function getFlashDraft(id, isNew){ return isNew ? window.__draftFlash : FLASHSALES.find(x=>x.id===id); }

function renderFlashPicker(f){
  const used=new Set((f.products||[]).filter(e=>e.type==='existing').map(e=>e.productId));
  const avail=PRODUCTS.filter(p=>!used.has(p.id));
  if(!avail.length) return '<p style="font-size:13px;color:var(--ink-soft);margin:0;">All products are already in this sale.</p>';
  return `<div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);">${avail.map(p=>`<label class="checkline flash-pick-row" data-name="${esc(String(p.title||'').toLowerCase())}" style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;cursor:pointer;"><input type="checkbox" name="flashPick" value="${esc(p.id)}"> ${esc(p.title)}</label>`).join('')}</div>`;
}
function filterFlashPicker(q){
  q=String(q||'').trim().toLowerCase();
  document.querySelectorAll('#flash-product-picker .flash-pick-row').forEach(r=>{ r.style.display=(!q||r.getAttribute('data-name').includes(q))?'flex':'none'; });
}
function addExistingToFlash(id, isNew){
  const f = getFlashDraft(id,isNew);
  const picked=[...document.querySelectorAll('#flash-product-picker input[name="flashPick"]:checked')].map(i=>i.value);
  if(!picked.length){ toast('Tick one or more products first'); return; }
  f.products = f.products||[];
  picked.forEach(pid=>{ if(!f.products.some(e=>e.type==='existing'&&e.productId===pid)) f.products.push({type:'existing', productId:pid}); });
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
  document.getElementById('flash-product-picker').innerHTML = renderFlashPicker(f);
}

function removeFlashProduct(id, idx){
  const isNewCheck = !FLASHSALES.find(x=>x.id===id);
  const f = getFlashDraft(id, isNewCheck);
  f.products.splice(idx,1);
  document.getElementById('flash-products-list').innerHTML = renderFlashProductsList(f);
  const picker=document.getElementById('flash-product-picker'); if(picker) picker.innerHTML = renderFlashPicker(f);
}

function saveFlashForm(id, isNew){
  const form = document.getElementById('flash-form'); const fd = new FormData(form);
  const draft = getFlashDraft(id,isNew);
  if(!draft.banner){ toast('Please add Flash Sale Image 1 (it is required)'); return; }
  const title = fd.get('title').trim();
  Object.assign(draft,{
    title, slug: slugify(fd.get('slug').trim()||title), subtitle: fd.get('subtitle').trim(),
    start: fd.get('start'), end: fd.get('end'), status: fd.get('status'), description: fd.get('description').trim(),
    display:{height:Number(fd.get('displayHeight'))||360,infoBg:fd.get('infoBg')||'',textColor:fd.get('textColor')||'#FFFFFF',accentColor:fd.get('accentColor')||'#D4AF37',imageFit:fd.get('imageFit')||'cover'},
    seo: { title: fd.get('seoTitle').trim(), keywords: fd.get('seoKeywords').trim(), description: fd.get('seoDescription').trim() }
  });
  if(isNew){ FLASHSALES.push(draft); window.__draftFlash=null; }
  saveKey(KEYS.flashsales, FLASHSALES); closeModal(); toast('Flash sale saved');
}

function sectionTypeLabel(t){ return {hero:'Hero banner',flashsale:'Flash sale',categories:'Categories',productCollection:'Product collection',categoryShowcase:'Products by category (auto)',recentlyViewed:'Recently viewed products',banner:'Promotional banner',legacyPromo:'Legacy promo',customHtml:'Custom text/HTML',social:'Social media link'}[t]||t; }

function reorderSection(dropIdx){
  if(DRAG_IDX===null || DRAG_IDX===dropIdx) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(DRAG_IDX,1); arr.splice(dropIdx,0,moved);
  DRAG_IDX=null; saveKey(KEYS.settings,SETTINGS);
}

function toggleSectionVisible(i){ SETTINGS.sections[i].visible = !SETTINGS.sections[i].visible; saveKey(KEYS.settings,SETTINGS); }
function duplicateSection(i){ const copy=JSON.parse(JSON.stringify(SETTINGS.sections[i])); copy.id=uid(); SETTINGS.sections.splice(i+1,0,copy); saveKey(KEYS.settings,SETTINGS); }
function removeSection(i){ if(!confirm('Delete this section?')) return; SETTINGS.sections.splice(i,1); saveKey(KEYS.settings,SETTINGS); }

function addSectionModal(){
  showModal(`<h2>Add Section</h2>
    <div class="form-grid">

}

function addSection(type){
  const base = {id:uid(),type,visible:true,title:sectionTypeLabel(type),subtitle:''};
  if(type==='flashsale') base.config={flashSaleId:''};
  if(type==='productCollection') base.config={filter:'all',count:6,layout:'grid',columns:3,productId:''};
  if(type==='categoryShowcase') base.config={count:3,categoryId:''};
  if(type==='recentlyViewed') base.config={count:6,layout:'grid',columns:3};
  if(type==='banner') base.config={bannerId: BANNERS[0]?BANNERS[0].id:''};
  if(type==='customHtml') base.config={html:'<p>Your custom content here.</p>'};
  if(type==='social'){ base.title='Follow us on Instagram'; base.subtitle='Stay connected for new arrivals and offers'; base.config={platform:'instagram',url:'',buttonText:'Follow us',customLabel:''}; }
  SETTINGS.sections.push(base); saveKey(KEYS.settings,SETTINGS); closeModal();
  if(type==='social'){ const idx=SETTINGS.sections.length-1; setTimeout(()=>editSectionModal(idx),120); }
}

function insertSectionAtPosition(section, position){
  const arr = SETTINGS.sections;
  if(position==='bottom'){ arr.push(section); return; }
  const idx = Math.max(0, Math.min(Number(position)||0, arr.length));
  arr.splice(idx, 0, section);
}

function createFlashSaleSection(form){
  const fd = new FormData(form);

function moveSectionToEdge(i,where){
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  if(where==='top') arr.unshift(moved); else arr.push(moved);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Section moved to '+where);
}

function moveSectionToPosition(i, position){
  if(position===''||position==null) return;
  const arr = SETTINGS.sections; const [moved] = arr.splice(i,1);
  insertSectionAtPosition(moved, position);
  saveKey(KEYS.settings,SETTINGS); closeModal(); toast('Flash sale section moved to the selected position');
}

function saveSectionForm(i){
  const form=document.getElementById('section-form'); const fd=new FormData(form);

function sxApplyLayoutFromForm(s,fd){
  if(!['productCollection','categoryShowcase','recentlyViewed','categories'].includes(s.type)) return;
  if(fd.get('layoutMode')===null) return; // spotlight or no layout fields shown: leave untouched
  s.config=s.config||{};
  const c=s.config;
  c.layoutMode=fd.get('layoutMode')==='grid'?'grid':'horizontal';
  c.initialCount=Math.max(1,Math.min(24,Math.floor(Number(fd.get('initialCount')))||4));
  c.desktopCols=[2,3,4].includes(Number(fd.get('desktopCols')))?Number(fd.get('desktopCols')):2;
  c.mobileCols=Number(fd.get('mobileCols'))===1?1:2;
  c.showViewAll=fd.get('showViewAll')!=='no';
  const u=String(fd.get('viewAllUrl')||'').trim();
  if(u && !(/^#\//.test(u)||/^https?:\/\//i.test(u))){ toast('View All destination ignored: use a #/ route or https link.'); delete c.viewAllUrl; }
  else if(u) c.viewAllUrl=u; else delete c.viewAllUrl;
}

async function sxResetBrandingVerify(form){
  const password=String(new FormData(form).get('password')||'');
  if(!password){ toast('Password required'); return; }
  if(!supabaseClient||!SUPABASE_READY){ toast('Supabase is not connected. Reset cancelled for safety.'); return; }
  try{
    const {data:{user},error:uErr}=await supabaseClient.auth.getUser();
    if(uErr||!user||!user.email){ toast('No authenticated admin session. Please log in again.'); return; }
    const {error}=await supabaseClient.auth.signInWithPassword({email:user.email, password});
    if(error){ toast('Password verification failed. Reset cancelled.'); return; }
    // Restore branding defaults only
    const D=DEFAULT_SETTINGS, A=SX_DEFAULT_ASSETS;
    SETTINGS.siteName=D.siteName;
    SETTINGS.logo=A.logo; SETTINGS.logoWidth=D.logoWidth||150;
    SETTINGS.favicon=A.favicon;
    SETTINGS.primaryColor=D.primaryColor; SETTINGS.primaryDark=D.primaryDark;
    SETTINGS.secondaryColor=D.secondaryColor; SETTINGS.secondaryDark=D.secondaryDark;
    SETTINGS.accentColor=D.accentColor;
    SETTINGS.headerBg=D.headerBg; SETTINGS.headerText=D.headerText;
    SETTINGS.bodyBg=D.bodyBg; SETTINGS.inkColor=D.inkColor; SETTINGS.inkSoft=D.inkSoft;
    SETTINGS.borderColor=D.borderColor; SETTINGS.cardBg=D.cardBg;
    SETTINGS.buttonBg=D.buttonBg; SETTINGS.buttonText=D.buttonText; SETTINGS.iconColor=D.iconColor;
    SETTINGS.footerBg=D.footerBg; SETTINGS.footerText=D.footerText;
    SETTINGS.hero=Object.assign({}, SETTINGS.hero||{}, {
      image:A.heroDesktop, desktopImage:A.heroDesktop, mobileImage:A.heroMobile,
      title:D.hero.title, subtitle:D.hero.subtitle, heading:D.hero.heading, subheading:D.hero.subheading,
      pillText:D.hero.pillText, buttonBgColor:D.hero.buttonBgColor, buttonTextColor:D.hero.buttonTextColor
    });
    SETTINGS.footer=Object.assign({}, SETTINGS.footer||{}, {about:D.footer.about, copyright:D.footer.copyright});
    SETTINGS.invoice=Object.assign({}, D.invoice||{}, {ownerName:'Taha Faiz', websiteUrl:'https://store.tfoda.com', logo:'', thankYou:'Thanks for the order'});
    applyTheme();
    const ok=await saveKey(KEYS.settings, SETTINGS);
    closeModal();
    if(ok) toast('Branding reset to TEFaura defaults');
    else toast('Could not save reset to cloud');
    render();
  }catch(e){
    console.error(e);
    toast('Verification error: '+(e.message||'unknown'));
  }
}

const SX_MEDIA_PAGE=24;
function mediaLibItemHtml(m){return `<div style="text-align:center;">

function mediaPickItemHtml(m){return `<button type="button" class="t ${MEDIA_PICKER_SELECTED.includes(m.id)?'sel':''}" id="media-pick-${m.id}" style="width:90px;height:90px;padding:0;background:var(--card);" onclick="selectMediaForField('${m.id}')"><img loading="lazy" decoding="async" src="${mediaSrc(m.id)}" alt=""></button>`;}
function sxInitMore(root){
  (root||document).querySelectorAll('.sx-more[data-sx-more]').forEach(sen=>{
    if(sen.__sxIO) return;
    const kind=sen.getAttribute('data-sx-more');
    const io=new IntersectionObserver(es=>{
      if(!es.some(e=>e.isIntersecting)) return;
      const grid=document.getElementById(kind==='lib'?'media-lib-grid':'media-pick-grid');
      if(!grid||!document.body.contains(sen)){ io.disconnect(); return; }
      const have=grid.children.length;
      grid.insertAdjacentHTML('beforeend',MEDIA.slice(have,have+SX_MEDIA_PAGE).map(kind==='lib'?mediaLibItemHtml:mediaPickItemHtml).join(''));
      if(grid.children.length>=MEDIA.length){ io.disconnect(); sen.remove(); }
      else { io.unobserve(sen); io.observe(sen); }
    },{rootMargin:'300px 0px'});
    sen.__sxIO=io; io.observe(sen);
  });
}

async function addMediaByUrl(){
  const input=document.getElementById('media-url-input');
  const url=input&&input.value.trim();
  if(!url){toast('Please enter an image URL');return;}
  if(!isValidHttpUrl(url) && !url.startsWith('data:image/')){toast('Please enter a valid image URL');return;}
  MEDIA.push({id:uid(),name:url,dataUrl:url});
  await saveKey(KEYS.media,MEDIA);
  input.value='';
  toast('Image added to Media Library ✓');
}

async function handleMediaLibraryUpload(input){
  const files=Array.from(input?.files||[]).filter(f=>f.type&&f.type.startsWith('image/'));
  if(!files.length){toast('Please choose image files');if(input)input.value='';return;}
  const status=document.getElementById('media-library-status');
  input.disabled=true;
  let done=0,failed=0;
  for(const file of files){
    if(status)status.textContent='Uploading '+(done+failed+1)+' of '+files.length+'…';
    try{
      const url=await uploadImageToSupabase(file);
      if(!Array.isArray(MEDIA))MEDIA=[];
      MEDIA.push({id:uid(),name:file.name||'image',dataUrl:url,publicUrl:url});
      done++;
    }catch(e){
      console.error('Media library upload failed:',e);
      failed++;
    }
  }
  if(done){ await saveKey(KEYS.media,MEDIA); }
  toast(done?(done+' image'+(done===1?'':'s')+' added to Media Library ✓'+(failed?' ('+failed+' failed)':'')):'Image upload failed');
  const st=document.getElementById('media-library-status');
  if(st&&!done)st.textContent='Upload failed. Please try again.';
  const inp=document.getElementById('media-library-device-input');
  if(inp){inp.disabled=false;inp.value='';}
}

function deleteMedia(id){
  if(!confirm('Delete this image?')) return;
  MEDIA = MEDIA.filter(m=>m.id!==id);
  saveKey(KEYS.media, MEDIA);
}

async function sxConfirmCloseStore(){
  const inp=document.getElementById('sx-close-pass'),err=document.getElementById('sx-close-err'),btn=document.getElementById('sx-close-go');

  if(!pass){ if(err) err.textContent='Please enter your admin password.'; return; }
  if(!supabaseClient){ if(err) err.textContent='Supabase is not available.'; return; }
  if(btn) btn.disabled=true;
  try{
    const u=await supabaseClient.auth.getUser();
    const email=u&&u.data&&u.data.user&&u.data.user.email;
    if(!email) throw new Error('Admin session expired. Please log in again.');
    const r=await supabaseClient.auth.signInWithPassword({email:email,password:pass});
    if(r.error) throw new Error('Wrong password.');
    const cur=sxStoreStatus();
    SETTINGS.storeStatus=Object.assign({},cur,{closed:true,closedAt:new Date().toISOString()});

    if(btn) btn.disabled=false;
  }
}

function pdChangeQty(delta, max, productId){
  const el=document.getElementById('pd-qty'); if(!el) return;
  let q=(Number(el.textContent)||1)+delta;
  q=Math.max(1,Math.min(q,Math.max(1,Number(max)||1)));
  el.textContent=q;
  const p=PRODUCTS.find(x=>x.id===productId);
  const calc=p?calculateOrder(p,q):null;
  const totalEl=document.getElementById('pd-total-price');
  if(totalEl){
    const unit=calc?calc.unitPrice:(Number(totalEl.getAttribute('data-unit-price'))||0);
    totalEl.textContent=money(calc?Math.max(0,unit*q-calc.promotionDiscount):unit*q);
  }
  const deliveryEl=document.getElementById('pd-delivery-info');
  if(deliveryEl && p){
    const configuredDelivery=Math.max(0,Number(p.deliveryCharges)||0);
    deliveryEl.innerHTML='Delivery: '+(calc&&calc.delivery>0?money(calc.delivery):'FREE')+' · Stock: '+(Math.max(0,Number(p.stock)||0)>0?Math.max(0,Number(p.stock)||0)+' available':'Out of stock');
  }
  const promoEl=document.getElementById('pd-promo-status');
  if(promoEl && calc){
    const parts=[];
    if(calc.promotionDiscount>0) parts.push((Number(p.promotion?.percentOff)||0)+'% off — '+money(calc.promotionDiscount)+' saved');
    if(calc.delivery===0 && Number(p.deliveryCharges||0)>0 && p.promotion?.freeDelivery && q>=Number(p.promotion.freeDeliveryQty||1)) parts.push('Delivery is FREE');
    if(calc.bonusQuantity>0) parts.push('Buy '+(p.promotion?.buyQty||'')+' Get '+(p.promotion?.freeQty||'')+' Free');
    promoEl.textContent=parts.length?('Promotion applied: '+parts.join(' • ')):'';

}
function findProductForCart(id){ return PRODUCTS.find(p=>p.id===id); }
function cartLineProductInfo(line){
  const p=findProductForCart(line.productId);
  if(!p) return null;
  const img=p.mainImage?mediaSrc(p.mainImage):(p.images&&p.images[0]?mediaSrc(p.images[0]):'');
  const original=Number(p.originalPrice??p.oldPrice??p.price)||0, special=Number(p.specialPrice??p.price)||original;
  const unit=Math.min(original||special,special||original);
  const stock=Math.max(0,Number(p.stock)||0);
  return {p,img,unit,stock,available:p.status==='published'&&stock>0};
}
function addToCart(productId, qty){
  qty=Math.max(1,Number(qty)||1);
  const p=findProductForCart(productId);
  if(!p){ toast('Product is not available.'); return; }
  if(p.status!=='published'){ toast('This product is currently unavailable.'); return; }
  const stock=Math.max(0,Number(p.stock)||0);
  if(stock<=0){ toast('This product is out of stock.'); return; }
  const existing=CART.find(i=>i.productId===productId);
  const currentQty=existing?Number(existing.qty)||0:0;
  let newQty=currentQty+qty;
  let limited=false;
  if(newQty>stock){ newQty=stock; limited=true; }
  if(existing) existing.qty=newQty; else CART.push({productId,qty:newQty});
  saveCartToStorage();
  refreshHeaderBadges();
  toast(limited?('Added to cart — limited to available stock ('+stock+') ✓'):'Added to cart ✓');
  if(route()==='/cart') render();
}
function updateCartQty(productId, delta){
  const line=CART.find(i=>i.productId===productId); if(!line) return;
  const info=cartLineProductInfo(line);
  let q=(Number(line.qty)||0)+delta;
  if(info) q=Math.min(q,Math.max(1,info.stock));
  if(q<1){ removeFromCart(productId); return; }
  line.qty=q; saveCartToStorage(); refreshHeaderBadges();
  if(route()==='/cart') render();
}
function setCartQty(productId, qty){
  const line=CART.find(i=>i.productId===productId); if(!line) return;
  const info=cartLineProductInfo(line);
  let q=Math.max(1,Number(qty)||1);
  if(info&&info.stock>0&&q>info.stock){ q=info.stock; toast('Limited to available stock ('+info.stock+')'); }
  line.qty=q; saveCartToStorage(); refreshHeaderBadges();
  if(route()==='/cart') render();
}
function removeFromCart(productId){
  CART=CART.filter(i=>i.productId!==productId);

/* ---------- Coupons ---------- */
/*
   Coupon reliability fix:
   - Coupon codes are normalized consistently (trim + uppercase).
   - Product/category IDs are compared as strings, so numeric/string IDs match.
   - "all" / "products" / "categories" scope values are normalized.
   - applicable_ids is accepted whether Supabase returns an array, JSON text,
     or a JSON object containing an ids array.
   - Coupon-loading errors are NOT silently converted into "coupon does not exist".
*/
let COUPONS=[];
let COUPON_LOAD_ERROR='';

function normalizeCouponCode(value){
  return String(value==null?'':value).trim().toUpperCase();
}
function normalizeCouponId(value){
  return String(value==null?'':value).trim();
}
function normalizeCouponScope(value){
  const s=String(value==null?'all':value).trim().toLowerCase();
  if(s==='products'||s==='product') return 'products';
  if(s==='categories'||s==='category') return 'categories';
  return 'all';
}
function normalizeCouponIds(value){
  if(Array.isArray(value)) return value.map(normalizeCouponId).filter(Boolean);
  if(value==null) return [];
  if(typeof value==='string'){
    const raw=value.trim();
    if(!raw) return [];
    try{
      const parsed=JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed.map(normalizeCouponId).filter(Boolean);
      if(parsed && Array.isArray(parsed.ids)) return parsed.ids.map(normalizeCouponId).filter(Boolean);
    }catch(_){}
    return raw.split(',').map(normalizeCouponId).filter(Boolean);
  }
  if(value && typeof value==='object' && Array.isArray(value.ids)){
    return value.ids.map(normalizeCouponId).filter(Boolean);
  }
  return [];
}
function findLoadedCoupon(code){
  const wanted=normalizeCouponCode(code);
  return COUPONS.find(c=>normalizeCouponCode(c.code)===wanted) || null;
}
async function loadCoupons(){
  COUPON_LOAD_ERROR='';
  COUPONS=[];
  if(!supabaseClient||!SUPABASE_READY){
    COUPON_LOAD_ERROR='Supabase is not ready yet.';
    return;
  }
  try{
    const {data,error}=await supabaseClient.from('storex_coupons').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    const rows=Array.isArray(data)?data:[];
    const isActive=v=>v===true || v===1 || String(v??'').trim().toLowerCase().match(/^(true|1|t|yes|on|active)$/);
    COUPONS=rows.filter(c=>c && isActive(c.active));
    // Keep the raw rows available when a database uses a different active representation.
    if(!COUPONS.length && rows.length){
      COUPONS=rows.filter(c=>c && c.active!==false && String(c.active??'').trim().toLowerCase()!=='false');
    }
  }catch(e){
    console.warn('StoreX coupons read failed:',e);
    COUPON_LOAD_ERROR=e?.message||'Unable to read coupons from Supabase.';
  }
}
const APPLIED_COUPON_KEY='StoreX.appliedCoupon.v1';
function getAppliedCoupon(){
  try{ const raw=sessionStorage.getItem(APPLIED_COUPON_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function setAppliedCoupon(c){ try{ sessionStorage.setItem(APPLIED_COUPON_KEY, JSON.stringify(c)); }catch(e){} }
function clearAppliedCoupon(){ try{ sessionStorage.removeItem(APPLIED_COUPON_KEY); }catch(e){} }

function couponAppliesToLine(coupon, productId){
  if(!coupon) return false;
  const scope=normalizeCouponScope(coupon.applicable_scope);
  if(scope==='all') return true;

  const ids=normalizeCouponIds(coupon.applicable_ids);
  const wantedProductId=normalizeCouponId(productId);

  if(scope==='products'){
    return ids.includes(wantedProductId);
  }

  if(scope==='categories'){
    const p=findProductForCart(productId);
    if(!p) return false;
    const categoryCandidates=[
      ...productCatIds(p),
      p.category,
      p.categoryId,
      p.category_id,
      p.categorySlug,
      p.category_slug
    ].map(normalizeCouponId).filter(Boolean);
    return categoryCandidates.some(categoryId=>ids.includes(categoryId));
  }

  return true;
}
function computeCouponDiscount(coupon, lines, subtotal){
  const eligibleLines=lines.filter(x=>couponAppliesToLine(coupon,x.info.p.id));
  const eligibleSubtotal=eligibleLines.reduce((n,x)=>n+x.info.unit*x.line.qty,0);
  let discount=0;
  const type=coupon.discount_type;
  if(type==='percent'){ discount=eligibleSubtotal*(Number(coupon.discount_value)||0)/100; }
  else if(type==='fixed'){ discount=Math.min(eligibleSubtotal, Number(coupon.discount_value)||0); }
  if(coupon.max_discount && Number(coupon.max_discount)>0){ discount=Math.min(discount, Number(coupon.max_discount)); }
  discount=Math.round(discount*100)/100;
  return {discount, freeShipping: !!coupon.free_shipping || type==='freeship'};
}
function defaultDeliveryFee(){
  const v=Number(SETTINGS?.defaultDeliveryCharge ?? SETTINGS?.deliveryCharge);
  return Number.isFinite(v)&&v>0?v:200;
}
async function validateCoupon(code, lines, subtotal){
  code=normalizeCouponCode(code);
  if(!code) return {ok:false,message:'Please enter a coupon code.'};

  // Always try a fresh load when the in-memory list is empty or the code is missing
  // (admin may have just created the coupon, or the first load failed silently).
  if(!findLoadedCoupon(code)){
    try{ await loadCoupons(); }catch(_){}
  }
  if(COUPON_LOAD_ERROR && !COUPONS.length){
    return {ok:false,message:'Coupons could not be loaded. Please refresh the page and try again. ('+COUPON_LOAD_ERROR+')'};
  }

  const coupon=findLoadedCoupon(code);
  if(!coupon) return {ok:false,message:'This coupon code does not exist. Check the code or wait a moment after creating it, then try again.'};
  const couponActive=!(coupon.active===false || ['false','0','off','inactive','no'].includes(String(coupon.active??'').trim().toLowerCase()));
  if(!couponActive) return {ok:false,message:'This coupon is not active.'};

  const now=Date.now();
  if(coupon.starts_at && new Date(coupon.starts_at).getTime()>now) return {ok:false,message:'This coupon is not active yet.'};
  if(coupon.ends_at && new Date(coupon.ends_at).getTime()<now) return {ok:false,message:'Coupon has expired.'};

  if(coupon.min_order && subtotal < Number(coupon.min_order)){
    return {ok:false,message:'Minimum order value is '+money(coupon.min_order)+'.'};
  }

  const safeLines=Array.isArray(lines)?lines.filter(x=>x&&x.info&&x.info.p):[];
  const eligible=safeLines.some(x=>couponAppliesToLine(coupon,x.info.p.id));
  if(!eligible){
    const scope=normalizeCouponScope(coupon.applicable_scope);
    if(scope==='all'){
      return {ok:false,message:'This coupon is configured for all products, but the product data could not be matched. Please refresh the page.'};
    }
    return {ok:false,message:'This coupon is not valid for the selected products.'};
  }
  if(coupon.usage_limit || coupon.per_customer_limit){
    try{
      if(supabaseClient && SUPABASE_READY){
        const {data,error}=await supabaseClient.rpc('storex_coupon_usage_stats',{p_code:coupon.code});
        if(!error && data){
          const stats=Array.isArray(data)?data[0]:data;
          if(coupon.usage_limit && stats && Number(stats.total_uses)>=Number(coupon.usage_limit)) return {ok:false,message:'This coupon has reached its usage limit.'};
        }
      }
    }catch(e){ /* usage RPC optional; skip silently if not deployed */ }
  }
  return {ok:true, coupon};
}
async function applyCouponFromCart(){
  const input=document.getElementById('coupon-input'); const msg=document.getElementById('coupon-msg');
  if(!input) return;
  const lines=CART.map(l=>({line:l,info:cartLineProductInfo(l)})).filter(x=>x.info);
  const subtotal=lines.reduce((n,x)=>n+x.info.unit*x.line.qty,0);
  const result=await validateCoupon(input.value, lines, subtotal);
  if(!result.ok){ if(msg){msg.textContent=result.message;msg.className='coupon-msg err';} return; }
  setAppliedCoupon({code:normalizeCouponCode(result.coupon.code)});
  if(msg){msg.textContent='Coupon applied successfully.';msg.className='coupon-msg ok';}
  toast('Coupon applied ✓');
  render();
}
function removeCouponFromCart(){ clearAppliedCoupon(); toast('Coupon removed'); render(); }

async function applyCouponFromCheckout(){

/* Cross-tab cache sync: if another tab receives a cloud update, this tab
   refreshes from the newest local snapshot without a hard browser reload. */
(function(){
  window.addEventListener('storage', function(e){
    if(e.key !== 'StoreX.customer.snapshot.v5' || !e.newValue) return;
    if(location.hash && location.hash.startsWith('#/admin-of-storex')) return;
    try{
      const item=JSON.parse(e.newValue);
      const c=item && item.data;
      if(!c) return;
      if(c.settings) SETTINGS=c.settings;
      if(Array.isArray(c.products)) PRODUCTS=c.products;
      if(Array.isArray(c.categories)) CATEGORIES=c.categories;
      if(Array.isArray(c.flashsales)) FLASHSALES=c.flashsales;
      if(Array.isArray(c.banners)) BANNERS=c.banners;
      if(Array.isArray(c.media)) MEDIA=c.media;
      if(Array.isArray(c.pages)) PAGES=c.pages;
      normalizeCloudState();
      applyTheme();
      render();
      applyMediaSizing();
      initLazyMedia();
    }catch(err){ console.warn('StoreX cross-tab cache sync skipped:',err); }
  });
})();

/* Promotion display and promotion-aware customer sorting. */
function promotionScore(p){
  const x=p?.promotion||{};let score=0;
  if(x.title)score+=10;
  if(Number(x.percentOff)>0)score+=Number(x.percentOff);
  if(Number(x.buyQty)>0&&Number(x.freeQty)>0)score+=Number(x.freeQty)*10;
  if(x.freeDelivery)score+=15;
  return score;
}
function sortCustomerProducts(list){
  const arr=[...list];
  const stockFirst=(a,b)=>(Math.max(0,Number(b.stock)||0)>0?1:0)-(Math.max(0,Number(a.stock)||0)>0?1:0);
  switch(CUSTOMER_PRODUCT_SORT){
    case 'promotion': return arr.sort((a,b)=>promotionScore(b)-promotionScore(a)||stockFirst(a,b));
    case 'price-low': return arr.sort((a,b)=>(Number(a.specialPrice??a.price)||0)-(Number(b.specialPrice??b.price)||0));
    case 'price-high': return arr.sort((a,b)=>(Number(b.specialPrice??b.price)||0)-(Number(a.specialPrice??a.price)||0));
    case 'newest': return arr.sort((a,b)=>Number(b.created_at?new Date(b.created_at).getTime():b.order||0)-Number(a.created_at?new Date(a.created_at).getTime():a.order||0));
    case 'discount': return arr.sort((a,b)=>{const da=Number(a.discount)||0,db=Number(b.discount)||0;return db-da;});
    case 'name': return arr.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||'')));
    default: return arr.sort((a,b)=>stockFirst(a,b)||(a.order||0)-(b.order||0));
  }
}

/* Replace cart checkout persistence with the atomic multi-product stock RPC. */
async function submitCheckout(){
  if(CHECKOUT_SUBMITTING)return;
  const form=document.getElementById('checkout-form');
  if(!form)return;
  const btn=document.getElementById('checkout-submit-btn');
  const fd=new FormData(form);
  const customer={
    name:String(fd.get('name')||'').trim(),
    phone:String(fd.get('phone')||'').trim(),
    email:String(fd.get('email')||'').trim(),
    city:String(fd.get('city')||'').trim(),
    address:String(fd.get('address')||'').trim(),
    notes:String(fd.get('notes')||'').trim()
  };
  if(!customer.name||!customer.phone||!customer.city||!customer.address){toast('Please complete all required fields.');return;}
  {const _e=sxValidateCustomer(customer);if(_e){toast(_e);return;}}
  const lines=CART.map(l=>({line:l,info:cartLineProductInfo(l)})).filter(x=>x.info);
  if(!lines.length){toast('Your cart is empty.');return;}
  for(const x of lines){
    if(x.line.qty>x.info.stock){toast(esc(x.info.p.title)+' — only '+x.info.stock+' left in stock.');return;}
  }
  CHECKOUT_SUBMITTING=true;
  if(btn){btn.disabled=true;btn.textContent='Placing order...';}
  try{
    if(!supabaseClient||!SUPABASE_READY)throw new Error('Order service is temporarily unavailable.');
    const subtotal=lines.reduce((n,x)=>n+x.info.unit*x.line.qty,0);
    const productPromo=computeProductPromotionTotals(lines);
    const coupon=getAppliedCoupon();
    const couponObj=coupon?findLoadedCoupon(coupon.code):null;
    if(couponObj){
      const revalidated=await validateCoupon(couponObj.code,lines,subtotal);
      if(!revalidated.ok){toast(revalidated.message);return;}
    }
    const couponCalc=couponObj?computeCouponDiscount(couponObj,lines,subtotal):{discount:0,freeShipping:false};
    const deliveryTotal=(couponCalc.freeShipping||productPromo.freeShipping)?0:defaultDeliveryFee();
    const totalDiscount=Math.round((productPromo.discount+couponCalc.discount)*100)/100;
    const orderNumber='SX-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
    const rows=lines.map(({line,info},idx)=>{
      const lineSubtotal=info.unit*line.qty;
      const share=subtotal>0?lineSubtotal/subtotal:0;
      const productCalc=calculateOrder(info.p,line.qty);
      const productLineDiscount=Math.round((productCalc.promotionDiscount||0)*100)/100;
      const couponLineDiscount=Math.round(couponCalc.discount*share*100)/100;
      const lineDiscount=Math.round((productLineDiscount+couponLineDiscount)*100)/100;
      const lineDelivery=idx===0?deliveryTotal:0;
      const promotionJson=buildOrderPromotionJson(
        productCalc.promotion,
        couponObj?.code||'',
        productLineDiscount,
        !!(productPromo.freeShipping && idx===0)
      );
      return {
        order_number:orderNumber,
        product_id:info.p.id,
        product_title:info.p.title,
        product_sku:info.p.sku||null,
        quantity:line.qty,
        unit_price:info.unit,
        original_price:Number(info.p.originalPrice??info.p.oldPrice??info.p.price)||info.unit,
        special_price:info.unit,
        discount_percent:0,
        delivery_charges:lineDelivery,
        discount_amount:lineDiscount,
        total_amount:Math.round((lineSubtotal-lineDiscount+lineDelivery)*100)/100,
        customer_name:customer.name,
        customer_phone:customer.phone,
        customer_email:customer.email||null,
        city:customer.city,
        customer_address:customer.address+(customer.notes?(' | Notes: '+customer.notes):''),
        status:'pending',
        promotion:normalizeOrderPromotion(promotionJson)
      };
    });
    const rpc=await supabaseClient.rpc('storex_create_cart_order_and_decrement_stock',{p_orders:rows});
    if(rpc.error)throw rpc.error;
    if(couponObj){
      try{
        await supabaseClient.from('storex_coupon_usage').insert({
          coupon_code:couponObj.code,
          customer_phone:customer.phone,
          customer_email:customer.email||null,
          order_number:orderNumber
        });
      }catch(e){console.warn('Coupon usage log skipped:',e);}
    }

      const p=PRODUCTS.find(x=>x.id===info.p.id);
      if(p)p.stock=Math.max(0,(Number(p.stock)||0)-line.qty);
    });
    clearCart();
    clearAppliedCoupon();
    toast('Order placed successfully ✓');
    showCheckoutInvoice(
      orderNumber,
      lines,
      customer,
      subtotal,
      {discount:totalDiscount,freeShipping:(couponCalc.freeShipping||productPromo.freeShipping)},
      deliveryTotal
    );
    location.hash='#/';
  }catch(e){
    console.error(e);
    toast('Order failed: '+(e.message||'Please try again'));
  }finally{
    CHECKOUT_SUBMITTING=false;
    if(btn){btn.disabled=false;btn.textContent='Place Order';}
  }
}

<script>
(function(){
  function fixCouponLoading(){
    if(typeof loadAdminCoupons!=='function') return;
    const old=loadAdminCoupons;
    window.loadAdminCoupons=async function(){
      if(!supabaseClient||!SUPABASE_READY){ADMIN_COUPONS=[];return;}
      try{
        const r=await supabaseClient.from('storex_coupons').select('*').order('created_at',{ascending:false});
        if(r.error) throw r.error;
        ADMIN_COUPONS=Array.isArray(r.data)?r.data:[];
      }catch(e){console.warn('StoreX coupon load failed:',e);ADMIN_COUPONS=[];}
    };
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fixCouponLoading); else fixCouponLoading();
})();

/* ---- Invoice print isolation (hide everything except the invoice's ancestors path) ---- */
(function(){
  function mark(){
    const inv=document.querySelector('.order-invoice');
    if(!inv) return false;
    let node=inv;
    while(node&&node!==document.body){
      const par=node.parentElement;
      if(par) Array.from(par.children).forEach(ch=>{ if(ch!==node&&!/^(SCRIPT|STYLE|LINK)$/.test(ch.tagName)) ch.setAttribute('data-print-hide','1'); });
      node=par;
    }
    document.body.classList.add('printing-invoice');
    return true;
  }
  function unmark(){
    document.body.classList.remove('printing-invoice');
    document.querySelectorAll('[data-print-hide]').forEach(el=>el.removeAttribute('data-print-hide'));
  }
  window.addEventListener('beforeprint',mark);
  window.addEventListener('afterprint',unmark);
})();

/* ---- Mobile search: collapse on scroll (not on the click that opened it) ---- */
(function(){
  let openedAt=0,lastY=window.scrollY||0,wasOpen=false;
  function collapse(){
    if(!MOBILE_SEARCH_OPEN) return;
    const input=document.querySelector('.search-form input[name="q"]');
    MOBILE_SEARCH_OPEN=false;
    document.querySelectorAll('.search-suggestions').forEach(b=>b.classList.remove('open'));
    document.querySelectorAll('.search-form.mobile-open').forEach(f=>f.classList.remove('mobile-open'));
    if(input&&document.activeElement===input) input.blur();
  }
  window.addEventListener('scroll',function(){
    const y=window.scrollY||0;
    if(MOBILE_SEARCH_OPEN&&!wasOpen) openedAt=Date.now();
    wasOpen=MOBILE_SEARCH_OPEN;
    const moved=Math.abs(y-lastY);
    lastY=y;
    if(!MOBILE_SEARCH_OPEN||window.innerWidth>900) return;
    if(Date.now()-openedAt<600||moved<8) return; // ignore focus/keyboard-induced jumps right after opening
    collapse();
  },{passive:true});
})();
</script>

  };
  function siteName(){try{return (typeof SETTINGS!=='undefined'&&SETTINGS&&SETTINGS.siteName)||'TEFaura';}catch(e){return 'TEFaura';}}
  function goldLast(el){
    if(el.dataset.sx) return; el.dataset.sx='1';
    if(el.children.length) return;                       // sirf plain text headings
    var t=(el.textContent||'').trim(), w=t.split(/\s+/);
    if(w.length<2) return;
    var last=w.pop(), s=document.createElement('span');
    s.className='sx-gold'; s.textContent=last;
    el.textContent=w.join(' ')+' '; el.appendChild(s);
  }
  function enhance(){
    var hdr=document.getElementById('site-header'); if(!hdr) return;     // admin par kuch nahi
    var main=document.querySelector('#site-header ~ main'); if(!main) return;

    var hs=(typeof SETTINGS!=='undefined'&&SETTINGS&&SETTINGS.hero)||{};
    var h1=main.querySelector('.hero h1');
    if(h1 && !h1.dataset.sx){
      goldLast(h1);
      if(hs.pillEnabled!==false){
        var pill=document.createElement('div'); pill.className='sx-pill';
        pill.textContent=(hs.pillText&&String(hs.pillText).trim())||('Welcome to '+siteName());
        var pa=hs.pillAlign||'left';
        pill.style.display='block';pill.style.width='fit-content';pill.style.maxWidth='100%';
        pill.style.marginLeft=(pa==='left')?'0':'auto';
        pill.style.marginRight=(pa==='right')?'0':'auto';
        if(pa==='center'){pill.style.marginLeft='auto';pill.style.marginRight='auto';}
        h1.parentNode.insertBefore(pill,h1);
      }
    }
    var hi=main.querySelector('.hero-inner');
    if(hi && !hi.querySelector('.sx-hero-badges')){
      var list=Array.isArray(hs.badges)?hs.badges:[
        {icon:'truck',title:'Fast Delivery',subtitle:'Across Pakistan',enabled:true},
        {icon:'shield',title:'Secure Payments',subtitle:'100% Safe',enabled:true},
        {icon:'medal',title:'Top Quality',subtitle:'Trusted Products',enabled:true}];
      list=list.filter(function(x){return x&&x.enabled!==false&&String(x.title||'').trim();});
      if(list.length){
        var b=document.createElement('div'); b.className='sx-hero-badges';
        var X=function(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
        b.innerHTML=list.map(function(x){return '<div class="sx-hero-badge"><i>'+(ICON[x.icon]||ICON.medal)+'</i><div><b>'+X(x.title)+'</b>'+(x.subtitle?'<span>'+X(x.subtitle)+'</span>':'')+'</div></div>';}).join('');
        hi.appendChild(b);
      }
    }
    main.querySelectorAll('.section-head h2:not([data-sx])').forEach(goldLast);

    var cs=main.querySelector('.cat-scroll');
    if(cs && !cs.querySelector('.sx-all')){
      var a=document.createElement('a'); a.className='cat-card sx-all'; a.href='#/category/all';
      a.innerHTML='<div class="cat-icon">'+ICON.grid+'</div><div class="cat-name">All</div>';
      cs.insertBefore(a,cs.firstChild);
    }

    var ft=document.getElementById('site-footer');
    if(ft && !(ft.previousElementSibling && ft.previousElementSibling.classList.contains('sx-trust'))){
      var t=document.createElement('div'); t.className='sx-trust';
      t.innerHTML=
        '<div><i>'+ICON.truck+'</i><p style="margin:0"><b>Fast Delivery</b><span>Across Pakistan</span></p></div>'+
        '<div><i>'+ICON.shield+'</i><p style="margin:0"><b>Secure Checkout</b><span>100% safe &amp; secure</span></p></div>'+
        '<div><i>'+ICON.pin+'</i><p style="margin:0"><b>WhatsApp Support</b><span>Order help anytime</span></p></div>'+
        '<div><i>'+ICON.help+'</i><p style="margin:0"><b>Customer Support</b><span>We\u2019re here to help</span></p></div>';
      ft.parentNode.insertBefore(t,ft);
    }
  }
  var raf=0;
  function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){try{enhance();}catch(e){console.warn('theme',e);}});}
  function start(){
    var app=document.getElementById('app'); if(!app){setTimeout(start,100);return;}
    new MutationObserver(schedule).observe(app,{childList:true,subtree:true});
    schedule();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();

<script id="StoreXUpdateBundle">
(function(){

  (function(){

    if(typeof orig!=='function') return;
    window.setCustomerProductSort=function(v){
      var bar=document.querySelector('.sort-chips');
      var x=bar?bar.scrollLeft:0;
      var r=orig.apply(this,arguments);
      var put=function(){var b=document.querySelector('.sort-chips');if(b&&Math.abs(b.scrollLeft-x)>1)b.scrollLeft=x;};
      put();
      requestAnimationFrame(function(){put();requestAnimationFrame(put);});
      setTimeout(put,60);setTimeout(put,180);setTimeout(put,400);
      return r;
    };

  function defBadges(){return [
    {icon:'truck',title:'Fast Delivery',subtitle:'Across Pakistan',enabled:true},
    {icon:'shield',title:'Secure Payments',subtitle:'100% Safe',enabled:true},
    {icon:'medal',title:'Top Quality',subtitle:'Trusted Products',enabled:true}];}
  function hx(v,d){v=String(v||'').trim();return /^#[0-9a-f]{6}$/i.test(v)?v:d;}
  function H(){return SETTINGS.hero;}

  window.sxHeroSet=function(k,v){H()[k]=v;};

  window.sxHBAdd=function(){badges().push({icon:'star',title:'New text box',subtitle:'',enabled:true});render();};
  window.sxHBDel=function(i){badges().splice(i,1);render();};
  window.sxHBMove=function(i,d){var a=badges(),j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;render();};
  window.sxHBtnSet=function(i,k,v){buttons()[i][k]=v;};
  window.sxHBtnAdd=function(){buttons().push({text:'New Button',url:'#/category/all',bg:'#1A1A1A',color:'#FFFFFF',outline:false,newTab:false,enabled:true});render();};
  window.sxHBtnDel=function(i){buttons().splice(i,1);render();};
  window.sxHBtnMove=function(i,d){var a=buttons(),j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;render();};
  window.sxHeroTextSave=function(){
    try{saveKey(KEYS.settings,SETTINGS);toast('Hero text boxes & buttons saved \u2713');}catch(e){toast('Save failed: '+(e.message||e));}
  };

  /* ================= 3. SEO sync (canonical, social tags, Product schema) ================= */
  function setM(name,content,attr){
    attr=attr||'name';var el=document.head.querySelector('meta['+attr+'="'+name+'"]');
    if(!el){el=document.createElement('meta');el.setAttribute(attr,name);document.head.appendChild(el);}
    el.setAttribute('content',content);
  }
  function curProduct(){
    try{
      var m=('#'+route()).match(/#\/p\/([^/?]+)/);if(!m)return null;var k=decodeURIComponent(m[1]);
      return (PRODUCTS||[]).find(function(x){return String(x.id)===k||(x.seo&&x.seo.slug===k);})||null;
    }catch(e){return null;}
  }
  window.sxSeoSync=function(title,desc){
    var base=SEO_CONFIG.siteUrl.replace(/\/$/,''),r=route(),p=curProduct();
    var priv=/^\/(cart|checkout|buy-now|order|order-confirmation|my-orders|wishlist|search|track-order|recently-viewed|admin-of-storex)/.test(r);
    var cr=p?('/p/'+((p.seo&&p.seo.slug)||p.id)):r.split('?')[0];
    var url=base+'/#'+cr;
    var canon=document.head.querySelector('link[rel="canonical"]');
    if(!canon){canon=document.createElement('link');canon.rel='canonical';document.head.appendChild(canon);}
    canon.href=url;
    setM('robots',priv?'noindex, follow':'index, follow, max-image-preview:large');
    setM('og:title',title,'property');setM('og:description',desc,'property');setM('og:url',url,'property');
    setM('twitter:title',title);setM('twitter:description',desc);
    var old=document.getElementById('StoreX-product-schema');if(old)old.remove();
    if(!p){setM('og:type','website','property');setM('og:image',SEO_CONFIG.socialImage,'property');setM('twitter:image',SEO_CONFIG.socialImage);return;}
    var img=p.mainImage?mediaSrc(p.mainImage):(p.images&&p.images[0]?mediaSrc(p.images[0]):'');
    if(img&&/^https?:/.test(img)){setM('og:image',img,'property');setM('twitter:image',img);}
    setM('og:type','product','property');
    var price=Number(p.specialPrice!=null?p.specialPrice:p.price)||0,stock=Math.max(0,Number(p.stock)||0);
    var data={'@context':'https://schema.org','@graph':[
      {'@type':'Product','name':p.title,'description':(p.shortDesc||p.fullDesc||p.title||'').toString().replace(/<[^>]*>/g,'').slice(0,300),
        'sku':p.sku||String(p.id),'brand':{'@type':'Brand','name':SEO_CONFIG.siteName},
        'offers':{'@type':'Offer','url':url,'priceCurrency':'PKR','price':String(price),'itemCondition':'https://schema.org/NewCondition',
          'availability':stock>0?'https://schema.org/InStock':'https://schema.org/OutOfStock','seller':{'@type':'Organization','name':SEO_CONFIG.siteName}}},
      {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':base+'/'},{'@type':'ListItem','position':2,'name':p.title,'item':url}]}]};
    if(img&&/^https?:/.test(img))data['@graph'][0].image=[img];
    var sc=document.createElement('script');sc.type='application/ld+json';sc.id='StoreX-product-schema';sc.textContent=JSON.stringify(data);document.head.appendChild(sc);
  };
  window.addEventListener('sxnav',function(){setTimeout(function(){try{window.sxSeoSync(document.title,(document.querySelector('meta[name="description"]')||{}).content||SEO_CONFIG.defaultDescription);}catch(e){}},400);});
  window.addEventListener('hashchange',function(){setTimeout(function(){try{window.sxSeoSync(document.title,(document.querySelector('meta[name="description"]')||{}).content||SEO_CONFIG.defaultDescription);}catch(e){}},400);});
  try{window.sxSeoSync(document.title,SEO_CONFIG.defaultDescription);}catch(e){}

  /* ================= 4. Returning to an already-open tab => fresh reload, never stale/offline ================= */
  (function(){
    var hiddenAt=0,MIN_AWAY=15000,waiting=false;
    function admin(){return /admin-of-storex/.test(location.hash);}
    function typing(){
      var f=document.activeElement;
      if(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName)&&String(f.value||'').trim()!=='')return true;
      return [].some.call(document.querySelectorAll('form input:not([type=hidden]):not([type=checkbox]):not([type=radio]),form textarea'),function(i){return String(i.value||'').trim()!=='';});
    }
    function fresh(force){
      if(admin())return;
      if(!force&&typing())return;
      if(navigator.onLine===false){waiting=true;return;}   /* wait for the connection instead of showing an offline copy */
      waiting=false;
      try{sessionStorage.setItem('sx.freshReload','1');}catch(e){}
      location.reload();
    }
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){hiddenAt=Date.now();return;}
      if(hiddenAt&&Date.now()-hiddenAt>=MIN_AWAY)fresh(false);
      hiddenAt=0;
    });
    window.addEventListener('pageshow',function(e){if(e&&e.persisted)fresh(true);});   /* back/forward cache restore */
    window.addEventListener('online',function(){if(waiting||hiddenAt===0)fresh(false);});
  })();
})();
</script>

<script id="StoreXAutoLink">
/* Makes the store WhatsApp number and email clickable everywhere on the website. */
(function(){
  var WA='https://wa.me/923301588630',MAIL='mailto:support@tefaura.com';
  var re=/(support@tefaura\.com)|(\+?92[\s-]?330[\s-]?1588630|\b0330[\s-]?1588630\b)/gi;
  var SKIP={A:1,BUTTON:1,INPUT:1,TEXTAREA:1,SELECT:1,SCRIPT:1,STYLE:1,NOSCRIPT:1,OPTION:1,CODE:1};
  function link(root){
    if(!root||!root.querySelectorAll)return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      if(!n.nodeValue||n.nodeValue.length<10)return NodeFilter.FILTER_REJECT;
      for(var e=n.parentNode;e&&e!==root.parentNode;e=e.parentNode){if(e.nodeType===1&&(SKIP[e.tagName]||e.isContentEditable))return NodeFilter.FILTER_REJECT;}
      re.lastIndex=0;return re.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
    var list=[],n;while((n=w.nextNode()))list.push(n);
    list.forEach(function(t){
      var txt=t.nodeValue,frag=document.createDocumentFragment(),last=0,m;re.lastIndex=0;
      while((m=re.exec(txt))){
        if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        var a=document.createElement('a');a.className='sx-autolink';a.textContent=m[0];
        if(m[1]){a.href=MAIL;}else{a.href=WA+'?text='+encodeURIComponent('Hello TEFaura, I need help.');a.target='_blank';a.rel='noopener';}
        frag.appendChild(a);last=m.index+m[0].length;
      }
      if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
      t.parentNode.replaceChild(frag,t);
    });
  }
  var timer=null;
  function schedule(){clearTimeout(timer);timer=setTimeout(function(){var a=document.getElementById('app');if(a)link(a);var f=document.getElementById('site-footer');if(f)link(f);},120);}
  function start(){
    var a=document.getElementById('app');if(!a){setTimeout(start,100);return;}
    new MutationObserver(schedule).observe(a,{childList:true,subtree:true,characterData:true});
    schedule();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
